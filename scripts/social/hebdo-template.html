<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #10151c;
    --paper: #ece7da;
    --paper-dim: #a9a89c;
    --gold: #cf9d4c;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{ width:1080px; height:1080px; }
  body{ background: var(--ink); position:relative; overflow:hidden; }

  /* Photo toujours la même d'une semaine à l'autre (voir
     scripts/social/generate_hebdo_image.py : le chemin est en dur dans
     le script, jamais un argument) — contrairement aux gabarits pub/
     daily qui changent de photo à chaque édition. Choisie le 18 août,
     retour utilisateur : "une belle image de paysage, toujours la
     même... plus simple, tu écris en dur l'image qu'on prend". Crédit
     dans assets/social/hebdo-photo-credit.json. */
  .photo-bg{
    position:absolute; inset:0;
    background-image:url(__PHOTO_SRC__);
    background-size:cover; background-position:center;
  }
  .scrim{
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(16,21,28,0.16) 0%, rgba(16,21,28,0.4) 55%, rgba(16,21,28,0.88) 100%);
  }

  .content{
    position:relative; z-index:2;
    width:100%; height:100%;
    display:flex; flex-direction:column; justify-content:flex-end;
    font-family: "JetBrains Mono", monospace;
    padding: 80px 92px 88px;
  }

  /* Même taille/position que instagram-template.html et
     pub-template-v4-hybride.html — cohérence inter-images (voir note du
     18 août dans pub-template-v5-stat.html). */
  .masthead{ display:flex; align-items:center; gap:16px; position:absolute; top:48px; left:80px; z-index:2; }
  .masthead svg{ width:78px; height:78px; filter: drop-shadow(0 2px 10px rgba(16,21,28,0.55)); }
  .masthead .word{ font-family:"Fraunces", serif; font-weight:700; font-size:58px; color: var(--paper); text-shadow: 0 2px 10px rgba(16,21,28,0.55); }
  .masthead .word .rio{ color: var(--gold); }

  .eyebrow{
    display:inline-block; align-self:flex-start;
    font-family:"JetBrains Mono", monospace; font-weight:700; font-size: 24px;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink);
    background: var(--gold); border-radius: 40px; padding: 10px 26px;
    margin-bottom: 32px;
  }

  /* La semaine couverte (ex. "11 → 17 août"), gros repère visuel — même
     rôle que le chiffre géant de pub-template-v5-stat.html, mais un
     repère temporel plutôt qu'une statistique. */
  .weekrange{
    font-family:"Fraunces", serif; font-weight:900; font-size: 108px; line-height:1;
    letter-spacing:-0.02em; color: var(--gold); max-width: 960px;
  }

  /* La conclusion de la semaine, en version condensée (même texte que
     la meta description ~150-160 caractères — voir docs/routine-hebdo-
     prompt.md, étape 3), jamais le récap complet. */
  .message{
    font-family:"Fraunces", serif; font-weight:600; font-size: 44px; line-height:1.28;
    letter-spacing:-0.005em; color: var(--paper); max-width: 860px;
    margin-top: 28px;
  }

  .cta{ font-family: "JetBrains Mono", monospace; font-weight:700; font-size: 32px; color: var(--gold); margin-top:40px; }

  .footer{
    display:flex; align-items:baseline; gap:14px; font-size:22px;
    letter-spacing:0.08em; text-transform:uppercase; margin-top:44px;
  }
  .footer .tagline{ color: var(--gold); font-weight:700; }
  .footer .sep{ color: var(--paper-dim); opacity:.5; }
  .footer .url{ color: var(--paper-dim); text-transform: lowercase; }
</style></head>
<body>
  <div class="photo-bg"></div>
  <div class="scrim"></div>
  <div class="content">
    <div class="masthead">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M57,96 L57,70 Q57,65 60,63" stroke="#cf9d4c"/>
        <path d="M63,96 L63,70 Q63,65 60,63" stroke="#cf9d4c"/>
        <path d="M60,63 L60,55" stroke="#cf9d4c"/>
        <path d="M60,55 L60,31" stroke="#6f8fae"/>
        <path d="M55.8,38.9 L60,31 L64.2,38.9" stroke="#6f8fae"/>
        <path d="M60,63 L53.4,56.9" stroke="#cf9d4c"/>
        <path d="M53.4,56.9 L34,39" stroke="#5e9c78"/>
        <path d="M36.97,47.5 L34,39 L42.69,41.3" stroke="#5e9c78"/>
        <path d="M60,63 L66.6,56.9" stroke="#cf9d4c"/>
        <path d="M66.6,56.9 L86,39" stroke="#bd6248"/>
        <path d="M83.03,47.5 L86,39 L77.31,41.3" stroke="#bd6248"/>
      </svg>
      <div class="word">Scéna<span class="rio">rio</span></div>
    </div>

    <div class="eyebrow">RÉCAP DE LA SEMAINE</div>
    <div class="weekrange">__WEEKRANGE__</div>
    <div class="message">__MESSAGE__</div>
    <div class="cta">__CTA__</div>

    <div class="footer"><span class="tagline">Le futur en 3 scénarios</span><span class="sep">·</span><span class="url">lesscenarios.fr</span></div>
  </div>
</body></html>
