<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #10151c;
    --paper: #ece7da;
    --paper-dim: #a9a89c;
    --gold: #cf9d4c;
    --favorable: #5e9c78;
    --stable: #6f8fae;
    --degrade: #bd6248;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{ width:1080px; height:1920px; }
  body{
    position:relative;
    overflow:hidden;
    font-family: "JetBrains Mono", monospace;
    background: linear-gradient(160deg, #10151c 0%, #171e27 55%, #10151c 100%);
    /* Zone de sécurité : Instagram masque le haut (icône profil + heure) et
       le bas (barre de réponse) d'une Story sur ~250px chacun. Colonne flex
       plutôt que du positionnement absolu, pour que la zone de contenu se
       centre proprement quelle que soit la longueur du titre/hook du jour —
       jamais de vide qui se creuse au milieu ni de débordement en bas. */
    display:flex;
    flex-direction:column;
    padding: 120px 76px 150px;
  }

  /* Photo de fond optionnelle — même mécanique que instagram-photo-template.html
     (marqueur __PHOTO_SRC__, rempli par generate_instagram_image.py --photo).
     Recadrée en 9:16 par object-fit:cover : n'importe quelle source (carrée ou
     16:9) se centre correctement sans déformation. Scrim plus appuyé qu'en
     carré — la colonne de texte est plus longue en Story, il faut un contraste
     texte/fond garanti sur toute la hauteur, pas seulement en haut/bas. */
  .photo{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    z-index:-2;
  }
  .scrim{
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(16,21,28,0.92) 0%, rgba(16,21,28,0.55) 16%, rgba(16,21,28,0.62) 50%, rgba(16,21,28,0.88) 78%, var(--ink) 100%);
    z-index:-1;
  }

  .masthead{
    display:flex; align-items:center; gap:20px;
    flex: 0 0 auto;
  }
  .masthead svg{ width:72px; height:72px; }
  .masthead .word{
    font-family:"Fraunces", serif; font-weight:700; font-size:52px; color: var(--paper);
  }
  .masthead .word .rio{ color: var(--gold); }

  .content{
    flex: 1 1 auto;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:36px;
  }

  .eyebrow{
    font-size:22px; letter-spacing:0.12em; text-transform:uppercase; color: var(--gold); font-weight:700;
  }

  .headline{
    font-family:"Fraunces", serif;
    font-weight:900;
    font-size: 92px;
    line-height:1.05;
    letter-spacing:-0.01em;
    color: var(--paper);
    text-wrap: balance;
  }

  .hook{
    font-family:"Inter", sans-serif;
    font-weight:600;
    font-size: 38px;
    line-height:1.35;
    color: var(--gold);
    text-wrap: balance;
  }

  .scenario-box{
    background: rgba(236,231,218,0.04);
    border: 1px solid rgba(236,231,218,0.12);
    border-radius: 20px;
    padding: 30px 34px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .scenario-row{
    display:flex;
    align-items:center;
    gap:20px;
    font-family:"Inter", sans-serif;
    font-weight:700;
    font-size:32px;
    color: var(--paper);
    padding: 6px 0 6px 24px;
    border-left: 6px solid transparent;
  }
  .scenario-row .arrow{ font-family:"JetBrains Mono", monospace; font-size:36px; flex-shrink:0; }
  .scenario-row .label{ flex:1; min-width:0; }
  .scenario-row[data-kind="favorable"]{ border-color: var(--favorable); }
  .scenario-row[data-kind="favorable"] .arrow{ color: var(--favorable); }
  .scenario-row[data-kind="stable"]{ border-color: var(--stable); }
  .scenario-row[data-kind="stable"] .arrow{ color: var(--stable); }
  .scenario-row[data-kind="degrade"]{ border-color: var(--degrade); }
  .scenario-row[data-kind="degrade"] .arrow{ color: var(--degrade); }

  /* --- CTA lien, pensé pour remplacer le sticker natif --- */
  /* Instagram bloque l'ajout programmatique d'un vrai sticker lien (API), donc
     ce bloc EST le lien : une pince visuelle qui imite le sticker natif
     (pilule dorée, icône chaîne, texte incitatif), assez grande et assez haut
     placée pour rester bien au-dessus de la barre de réponse. Le lecteur ne
     peut pas taper dessus, mais peut vite comprendre qu'il faut aller voir la
     bio — d'où la mention explicite "Lien en bio" en dessous. */
  .cta-wrap{
    flex: 0 0 auto;
    margin-top: 48px;
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  .cta-pill{
    display:flex; align-items:center; gap:14px;
    background: var(--gold);
    color: var(--ink);
    border-radius: 100px;
    padding: 22px 40px;
    font-family:"Inter", sans-serif;
    font-weight:700;
    font-size: 34px;
  }
  .cta-pill svg{ width:32px; height:32px; flex-shrink:0; }
  .cta-note{
    font-size:24px; letter-spacing:0.06em; text-transform:uppercase; color: var(--paper-dim); font-weight:700;
  }

  .footer{
    flex: 0 0 auto;
    margin-top: 28px;
    display:flex; align-items:baseline; justify-content:center; gap:14px;
    font-size:20px; letter-spacing:0.08em; text-transform:uppercase;
  }
  .footer .tagline{ color: var(--gold); font-weight:700; }
  .footer .sep{ color: var(--paper-dim); opacity:.5; }
  .footer .url{ color: var(--paper-dim); }
</style></head>
<body>

  <img class="photo" src="__PHOTO_SRC__">
  <div class="scrim"></div>

  <div class="masthead">
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M57,96 L57,70 Q57,65 60,63" stroke="#cf9d4c"/>
      <path d="M63,96 L63,70 Q63,65 60,63" stroke="#cf9d4c"/>
      <path d="M60,63 L60,55" stroke="#cf9d4c"/>
      <path d="M60,55 L60,31" stroke="#6f8fae"/>
      <path d="M55.8,38.9 L60,31 L64.2,38.9" stroke="#6f8fae"/>
      <path d="M60,63 L53.4,56.9" stroke="#cf9d4c"/>
      <path d="M53.4,56.9 L34,39" stroke="#5e9c78"/>
      <path d="M36.97,47.5 L34,39 L42.69,41.3" stroke="#5e9c78"/>
      <path d="M60,63 L66.6,56.9" stroke="#cf9d4c"/>
      <path d="M66.6,56.9 L86,39" stroke="#bd6248"/>
      <path d="M83.03,47.5 L86,39 L77.31,41.3" stroke="#bd6248"/>
    </svg>
    <div class="word">Scéna<span class="rio">rio</span></div>
  </div>

  <div class="content">
    <div class="eyebrow">L'édition du jour</div>
    <div class="headline">__TITLE__</div>
    <div class="hook">__HOOK__</div>
    <div class="scenario-box">
      __SCENARIO_ROWS__
    </div>
  </div>

  <div class="cta-wrap">
    <div class="cta-pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1-1"/></svg>
      Lire les 3 scénarios
    </div>
    <div class="cta-note">👆 Lien en bio</div>
  </div>

  <div class="footer"><span class="tagline">Le futur en 3 scénarios</span><span class="sep">·</span><span class="url">lesscenarios.fr</span></div>

</body></html>
