<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #10151c;
    --paper: #ece7da;
    --paper-dim: #a9a89c;
    --gold: #cf9d4c;
    --stable: #6f8fae;
    --favorable: #5e9c78;
    --degrade: #bd6248;
    /* 5e couleur, réservée à la catégorie "futur" — même registre
       désaturé que les 4 autres, aucune n'était disponible pour une
       5e catégorie sans se marcher dessus. */
    --futur: #9b7fc0;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{ width:1080px; height:1080px; }
  body{ background: var(--ink); position:relative; overflow:hidden; }

  .photo-bg{
    position:absolute; inset:0;
    background-image:url(__PHOTO_SRC__);
    background-size:cover; background-position:center;
  }
  /* Voile allégé le 14 août (retour utilisateur : "trop pastel, trop de
     filtre") — la photo doit rester le sujet visuel, le voile juste ce
     qu'il faut pour que le texte du bas reste lisible.
     **Vrai bandeau noir rajouté le 14 août (3e retour : "pas beau,
     essaie plutôt un bandeau noir en haut, tu as oublié le dégradé")**
     — le plateau à 0.94 précédent laissait encore transparaître la
     couleur de la photo (pas un vrai noir). Noir plein (opacité 1,
     0-10%) en bandeau net sous le logo.
     **4e retour, même jour : le dégradé retombait à 0 avant de remonter
     à 0.14, créant un "saut de couleur" (bande de photo brute totalement
     sans voile, visible comme un défaut).** Corrigé : un seul dégradé
     continu du noir plein jusqu'au niveau minimum du voile (0.14, jamais
     0), sans palier intermédiaire à zéro.
     **5e retour, même jour : "réduit un peu le noir du début pour éviter
     l'effet double couleur noir/bleu"** — le palier plein (opacité 1) sur
     10% donnait un bloc de noir uni trop net à côté du bleu du ciel,
     lu comme deux couleurs empilées plutôt qu'un fondu. Retiré le
     palier : la courbe descend en continu dès 0% (0.90 en haut, jamais
     un vrai noir plat), pour une transition progressive du logo vers la
     photo plutôt qu'un bloc suivi d'une chute. */
  .scrim{
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(16,21,28,0.90) 0%, rgba(16,21,28,0.68) 10%, rgba(16,21,28,0.30) 18%, rgba(16,21,28,0.14) 26%, rgba(16,21,28,0.38) 55%, rgba(16,21,28,0.86) 100%);
  }
  /* 5 catégories, 5 couleurs d'accent : manifeste = or (identité),
     citation = bleu (calme/sagesse), question = vert (invitation à
     réagir), chiffre = orange (attire l'oeil sur un fait qui mérite
     qu'on s'arrête dessus), futur = violet (projection, distinct des
     4 couleurs déjà utilisées ailleurs sur le site). Opacité réduite le
     14 août (même retour utilisateur) — la teinte doit rester une
     signature discrète, pas délaver la photo. */
  .tint{ position:absolute; inset:0; mix-blend-mode: color; background: var(--gold); opacity:0.08; }
  body[data-accent="citation"] .tint{ background: var(--stable); }
  body[data-accent="question"] .tint{ background: var(--favorable); }
  body[data-accent="chiffre"] .tint{ background: var(--degrade); }
  body[data-accent="futur"] .tint{ background: var(--futur); }

  /* Cadre fin + grand guillemet, repris de V2 */
  .frame{ position:absolute; inset:36px; border: 2px solid rgba(236,231,218,0.22); z-index:1; pointer-events:none; }
  .quote-glyph{
    position:absolute; top:96px; left:80px; z-index:1;
    font-family:"Fraunces", serif; font-weight:900; font-size:300px; line-height:1;
    color: rgba(207,157,76,0.20);
    display:none;
  }
  body[data-accent="citation"] .quote-glyph{ display:block; color: rgba(111,143,174,0.24); }

  /* Contenu remonté le 14 août (retour utilisateur : "le titre plus
     haut") — centré verticalement plutôt que collé en bas, pour mieux
     utiliser l'espace de la photo au lieu de tout tasser dans le tiers
     inférieur. */
  .content{
    position:relative; z-index:2;
    width:100%; height:100%;
    display:flex; flex-direction:column; justify-content:center;
    font-family: "JetBrains Mono", monospace;
    padding: 80px 92px 88px;
  }

  /* Taille alignée sur le gabarit daily le 14 août (retour utilisateur :
     "le logo est trop petit... tout doit être cohérent") — même 78px/58px
     que instagram-template.html, seule référence de cohérence inter-images. */
  .masthead{ display:flex; align-items:center; gap:16px; position:absolute; top:48px; left:80px; z-index:2; }
  .masthead svg{ width:78px; height:78px; filter: drop-shadow(0 2px 10px rgba(16,21,28,0.55)); }
  /* Ombre portée ajoutée le 14 août : le voile allégé peut laisser un
     ciel/fond très clair juste sous le logo selon la photo (ex. ciel
     blanc) — le texte "paper" clair devient illisible sans un minimum
     de contraste propre, indépendant du voile général. */
  .masthead .word{ font-family:"Fraunces", serif; font-weight:700; font-size:58px; color: var(--paper); text-shadow: 0 2px 10px rgba(16,21,28,0.55); }
  .masthead .word .rio{ color: var(--gold); }

  /* Pastille pleine, repris de V2 */
  .eyebrow{
    display:inline-block; align-self:flex-start;
    font-family:"JetBrains Mono", monospace; font-weight:700; font-size: 24px;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink);
    background: var(--gold); border-radius: 40px; padding: 10px 26px;
    margin-bottom: 32px;
  }
  body[data-accent="citation"] .eyebrow{ background: var(--stable); }
  body[data-accent="question"] .eyebrow{ background: var(--favorable); }
  body[data-accent="chiffre"] .eyebrow{ background: var(--degrade); }
  body[data-accent="futur"] .eyebrow{ background: var(--futur); }

  /* Typo plus grande et plus lourde, repris de V3. */
  .message{
    font-family:"Fraunces", serif; font-weight:900; font-size: 86px; line-height:1.1;
    letter-spacing:-0.02em; color: #ffffff; max-width: 900px;
  }
  .message .hl{ color: var(--gold); }
  /* Citation entière passée en bleu clair le 14 août (retour utilisateur :
     "citation en bleu clair") — même bleu que l'attribution (#bcd6ef),
     cohérence complète du bloc citation. Le mot surligné passe en blanc
     pour garder un vrai contraste avec le reste de la phrase, sinon plus
     aucune distinction visuelle entre le mot mis en avant et le texte
     autour (les deux étaient au même bleu). */
  body[data-accent="citation"] .message{ color: #bcd6ef; }
  body[data-accent="citation"] .message .hl{ color: #ffffff; }
  body[data-accent="question"] .message .hl{ color: var(--favorable); }
  body[data-accent="chiffre"] .message .hl{ color: var(--degrade); }
  body[data-accent="futur"] .message .hl{ color: var(--futur); }

  /* Attribution passée dans le même bleu clair que le mot surligné
     (#bcd6ef, ligne .hl citation ci-dessus) — retour utilisateur : "le
     même". Change le repère visuel de "texte secondaire discret" vers
     "signature de la citation" — cohérent avec le mot mis en avant dans
     la phrase juste au-dessus. */
  .attribution{ font-family:"Inter", sans-serif; font-weight:600; font-size: 34px; color: #bcd6ef; margin-top: 28px; }
  .cta{ font-family: "JetBrains Mono", monospace; font-weight:700; font-size: 32px; color: var(--gold); margin-top:46px; }

  /* Repositionné le 14 août (retour utilisateur : "c'est une footnote,
     c'est tout en bas") — depuis que .content est centré verticalement
     (voir plus haut), le footer suivait le bloc de texte et finissait
     n'importe où au milieu de l'image. Sorti du flux, ancré en bas comme
     une vraie note de bas de page, indépendant de la position du texte
     au-dessus. */
  .footer{
    position:absolute; left:92px; right:92px; bottom:88px; z-index:2;
    display:flex; align-items:baseline; gap:14px; font-size:22px;
    letter-spacing:0.08em; text-transform:uppercase;
  }
  .footer .tagline{ color: var(--gold); font-weight:700; }
  .footer .sep{ color: var(--paper-dim); opacity:.5; }
  .footer .url{ color: var(--paper-dim); text-transform: lowercase; }
</style></head>
<body data-accent="__ACCENT__">
  <div class="photo-bg"></div>
  <div class="tint"></div>
  <div class="scrim"></div>
  <div class="frame"></div>
  <div class="quote-glyph">“</div>
  <div class="content">
    <div class="masthead">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M57,96 L57,70 Q57,65 60,63" stroke="#cf9d4c"/>
        <path d="M63,96 L63,70 Q63,65 60,63" stroke="#cf9d4c"/>
        <path d="M60,63 L60,55" stroke="#cf9d4c"/>
        <path d="M60,55 L60,31" stroke="#6f8fae"/>
        <path d="M55.8,38.9 L60,31 L64.2,38.9" stroke="#6f8fae"/>
        <path d="M60,63 L53.4,56.9" stroke="#cf9d4c"/>
        <path d="M53.4,56.9 L34,39" stroke="#5e9c78"/>
        <path d="M36.97,47.5 L34,39 L42.69,41.3" stroke="#5e9c78"/>
        <path d="M60,63 L66.6,56.9" stroke="#cf9d4c"/>
        <path d="M66.6,56.9 L86,39" stroke="#bd6248"/>
        <path d="M83.03,47.5 L86,39 L77.31,41.3" stroke="#bd6248"/>
      </svg>
      <div class="word">Scéna<span class="rio">rio</span></div>
    </div>

    <div class="eyebrow">__EYEBROW__</div>
    <div class="message">__MESSAGE__</div>
    <div class="attribution">__ATTRIBUTION__</div>
    <div class="cta">__CTA__</div>

    <div class="footer"><span class="tagline">Le futur en 3 scénarios</span><span class="sep">·</span><span class="url">lesscenarios.fr</span></div>
  </div>
</body></html>
