<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #10151c;
    --paper: #ece7da;
    --paper-dim: #a9a89c;
    --gold: #cf9d4c;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{ width:1080px; height:1080px; }
  body{ background: var(--ink); position:relative; overflow:hidden; }

  /* Photo suggérée, pas affichée franchement — un fort filtre noir
     dessus (86%) : elle change chaque semaine mais reste un fond
     texturé, jamais le sujet de l'image. Version la plus "sage" des 3
     propositions. */
  .photo-bg{
    position:absolute; inset:0;
    background-image:url(__PHOTO_SRC__);
    background-size:cover; background-position:center;
    filter: saturate(0.85) brightness(0.9);
  }
  .scrim{ position:absolute; inset:0; background: rgba(16,21,28,0.86); }

  .content{
    position:relative; z-index:1;
    width:100%; height:100%;
    display:flex; flex-direction:column; justify-content:center;
    font-family: "JetBrains Mono", monospace;
    padding: 84px 100px;
  }

  .accent-bar{ position:absolute; top:0; left:0; right:0; height:8px; z-index:2; }
  body[data-accent="manifeste"] .accent-bar{ background: var(--gold); }
  body[data-accent="citation"] .accent-bar{ background: #6f8fae; }

  .masthead{ display:flex; align-items:center; gap:18px; position:absolute; top:56px; left:100px; }
  .masthead svg{ width:64px; height:64px; }
  .masthead .word{ font-family:"Fraunces", serif; font-weight:700; font-size:46px; color: var(--paper); }
  .masthead .word .rio{ color: var(--gold); }

  .eyebrow{
    display:inline-block; align-self:flex-start;
    font-family:"JetBrains Mono", monospace; font-weight:700; font-size: 26px;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold);
    border: 2px solid var(--gold); border-radius: 40px; padding: 10px 26px;
    margin-bottom: 44px;
  }

  .message{ font-family:"Fraunces", serif; font-weight:700; font-size: 74px; line-height:1.24; letter-spacing:-0.01em; color: var(--paper); }
  .message .hl{ color: var(--gold); }
  .attribution{ font-family:"Inter", sans-serif; font-weight:600; font-size: 34px; color: var(--paper-dim); margin-top: 30px; }
  .cta{ font-family: "JetBrains Mono", monospace; font-weight:700; font-size: 32px; color: var(--gold); margin-top:52px; }

  .footer{
    position:absolute; bottom:52px; left:100px; z-index:2;
    display:flex; align-items:baseline; gap:14px; font-size:22px;
    letter-spacing:0.08em; text-transform:uppercase;
  }
  .footer .tagline{ color: var(--gold); font-weight:700; }
  .footer .sep{ color: var(--paper-dim); opacity:.5; }
  .footer .url{ color: var(--paper-dim); text-transform: lowercase; }
</style></head>
<body data-accent="__ACCENT__">
  <div class="photo-bg"></div>
  <div class="scrim"></div>
  <div class="accent-bar"></div>
  <div class="content">
    <div class="masthead">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M57,96 L57,70 Q57,65 60,63" stroke="#cf9d4c"/>
        <path d="M63,96 L63,70 Q63,65 60,63" stroke="#cf9d4c"/>
        <path d="M60,63 L60,55" stroke="#cf9d4c"/>
        <path d="M60,55 L60,31" stroke="#6f8fae"/>
        <path d="M55.8,38.9 L60,31 L64.2,38.9" stroke="#6f8fae"/>
        <path d="M60,63 L53.4,56.9" stroke="#cf9d4c"/>
        <path d="M53.4,56.9 L34,39" stroke="#5e9c78"/>
        <path d="M36.97,47.5 L34,39 L42.69,41.3" stroke="#5e9c78"/>
        <path d="M60,63 L66.6,56.9" stroke="#cf9d4c"/>
        <path d="M66.6,56.9 L86,39" stroke="#bd6248"/>
        <path d="M83.03,47.5 L86,39 L77.31,41.3" stroke="#bd6248"/>
      </svg>
      <div class="word">Scéna<span class="rio">rio</span></div>
    </div>

    <div class="eyebrow">__EYEBROW__</div>
    <div class="message">__MESSAGE__</div>
    <div class="attribution">__ATTRIBUTION__</div>
    <div class="cta">__CTA__</div>

    <div class="footer"><span class="tagline">Le futur en 3 scénarios</span><span class="sep">·</span><span class="url">lesscenarios.fr</span></div>
  </div>
</body></html>
