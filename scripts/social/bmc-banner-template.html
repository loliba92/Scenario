<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #10151c;
    --paper: #ece7da;
    --paper-dim: #a9a89c;
    --gold: #cf9d4c;
    --favorable: #5e9c78;
    --stable: #6f8fae;
    --degrade: #bd6248;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{ width:1600px; height:400px; }
  body{
    background:
      radial-gradient(circle at 14% 20%, rgba(207,157,76,0.16), transparent 42%),
      radial-gradient(circle at 90% 85%, rgba(111,143,174,0.14), transparent 45%),
      var(--ink);
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:"Inter", sans-serif;
    position:relative;
    overflow:hidden;
    padding: 0 96px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:24px;
    flex: none;
  }
  .brand svg{ width:96px; height:96px; }
  .brand .word{
    font-family:"Fraunces", serif;
    font-weight:700;
    font-size:64px;
    color: var(--paper);
    line-height:1;
  }
  .brand .word .rio{ color: var(--gold); }

  .divider{
    width:1px;
    height:180px;
    background: linear-gradient(180deg, transparent, rgba(169,168,156,0.35), transparent);
    flex: none;
    margin: 0 64px;
  }

  .pitch{
    display:flex;
    flex-direction:column;
    gap:22px;
    max-width: 760px;
  }

  .pitch-line{
    font-family:"Fraunces", serif;
    font-weight:600;
    font-size:40px;
    line-height:1.22;
    color: var(--paper);
  }

  .scenarios{
    display:flex;
    align-items:center;
    gap:28px;
    font-family:"JetBrains Mono", monospace;
    font-size:20px;
    letter-spacing:0.02em;
  }

  .scenario-item{
    display:flex;
    align-items:center;
    gap:10px;
    color: var(--paper-dim);
  }

  .dot{
    width:13px;
    height:13px;
    border-radius:50%;
    flex:none;
  }
  .dot.favorable{ background: var(--favorable); box-shadow: 0 0 10px var(--favorable); }
  .dot.stable{ background: var(--stable); box-shadow: 0 0 10px var(--stable); }
  .dot.degrade{ background: var(--degrade); box-shadow: 0 0 10px var(--degrade); }

  .url{
    position:absolute;
    bottom:28px;
    right:96px;
    font-family:"JetBrains Mono", monospace;
    font-size:18px;
    letter-spacing:0.06em;
    color: var(--paper-dim);
  }
  .url .gold{ color: var(--gold); }
</style>
</head>
<body>

  <div class="brand">
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Scénario">
      <path d="M57,96 L57,70 Q57,65 60,63" stroke="#cf9d4c"/>
      <path d="M63,96 L63,70 Q63,65 60,63" stroke="#cf9d4c"/>
      <path d="M60,63 L60,55" stroke="#cf9d4c"/>
      <path d="M60,55 L60,31" stroke="#6f8fae"/>
      <path d="M55.8,38.9 L60,31 L64.2,38.9" stroke="#6f8fae"/>
      <path d="M60,63 L53.4,56.9" stroke="#cf9d4c"/>
      <path d="M53.4,56.9 L34,39" stroke="#5e9c78"/>
      <path d="M36.97,47.5 L34,39 L42.69,41.3" stroke="#5e9c78"/>
      <path d="M60,63 L66.6,56.9" stroke="#cf9d4c"/>
      <path d="M66.6,56.9 L86,39" stroke="#bd6248"/>
      <path d="M83.03,47.5 L86,39 L77.31,41.3" stroke="#bd6248"/>
    </svg>
    <div class="word">Scéna<span class="rio">rio</span></div>
  </div>

  <div class="divider"></div>

  <div class="pitch">
    <div class="pitch-line">Chaque jour, une actualité clé décryptée en trois scénarios chiffrés.</div>
    <div class="scenarios">
      <span class="scenario-item"><span class="dot favorable"></span>Favorable</span>
      <span class="scenario-item"><span class="dot stable"></span>Stable</span>
      <span class="scenario-item"><span class="dot degrade"></span>Dégradé</span>
    </div>
  </div>

  <div class="url">les<span class="gold">scenarios</span>.fr</div>

</body></html>
