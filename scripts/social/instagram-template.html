<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #10151c;
    --paper: #ece7da;
    --paper-dim: #a9a89c;
    --gold: #cf9d4c;
    --favorable: #5e9c78;
    --stable: #6f8fae;
    --degrade: #bd6248;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{ width:1080px; height:1080px; }
  body{
    background:
      radial-gradient(circle at 20% 10%, rgba(207,157,76,0.18), transparent 45%),
      radial-gradient(circle at 85% 95%, rgba(111,143,174,0.15), transparent 45%),
      var(--ink);
    display:flex;
    flex-direction:column;
    justify-content:center;
    font-family: "JetBrains Mono", monospace;
    position:relative;
    overflow:hidden;
    padding: 76px 84px;
    gap: 40px;
  }
  .masthead{
    display:flex;
    align-items:center;
    gap:20px;
    position:absolute;
    top:48px; left:84px;
  }
  .masthead svg{ width:78px; height:78px; }
  .masthead .word{
    font-family:"Fraunces", serif;
    font-weight:700;
    font-size:58px;
    color: var(--paper);
  }
  .masthead .word .rio{ color: var(--gold); }

  /* Pastille "sujet du jour" ajoutée le 14 août (retour utilisateur :
     cohérence avec la pastille de catégorie des images de pub) — même
     recette (JetBrains Mono, fond plein, coins arrondis), toujours dorée
     ici puisque le daily n'a pas de catégories à distinguer par couleur.
     **Repositionnée le 14 août** : d'abord posée en tête du bloc de
     contenu centré verticalement, elle finissait collée sous le logo
     (le bloc centré démarre haut quand le titre est long) — retour
     utilisateur "le tag est sur le logo". Déplacée dans la même ligne
     que le masthead (voir HTML), position fixe garantie, ne dépend plus
     de la hauteur du titre. */
  .masthead .eyebrow{
    font-family:"JetBrains Mono", monospace; font-weight:700; font-size: 22px;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink);
    background: var(--gold); border-radius: 40px; padding: 9px 22px;
    margin-left: 4px;
  }

  .headline{
    font-family:"Fraunces", serif;
    font-weight:900;
    font-size: 104px;
    line-height:1.04;
    letter-spacing:-0.015em;
    color: var(--paper);
    margin-top: 20px;
  }

  /* Paragraphe de contexte, ajouté le 24 août puis fusionné en un seul
     bloc le même jour — voir instagram-photo-template.html pour la
     raison (accroche dorée + ligne grise l'une sous l'autre faisait
     deux légendes de couleurs différentes, "ça fait brouillon"). Un
     seul paragraphe, une seule couleur, 1-2 phrases courtes. */
  .context{
    font-family:"Inter", sans-serif;
    font-weight:500;
    font-size: 38px;
    line-height:1.35;
    color: var(--paper);
    margin-top: 20px;
  }

  .scenarios{
    display:flex;
    flex-direction:column;
    gap:26px;
    margin-top: 16px;
  }
  .scenario-row{
    display:flex;
    align-items:center;
    gap:14px;
    font-family:"Inter", sans-serif;
    font-weight:700;
    font-size:32px;
    color: var(--paper);
    padding: 6px 0 6px 28px;
    border-left: 7px solid transparent;
  }
  .scenario-row .arrow{ font-family:"JetBrains Mono", monospace; font-size:38px; flex-shrink:0; }
  /* Mot explicite (Favorable/Stable/Dégradé), ajouté le 24 août — voir
     instagram-photo-template.html pour la raison (la couleur/flèche
     seule ne "parle" qu'à qui connaît déjà le code du site). */
  .scenario-row .kind-word{
    font-family:"JetBrains Mono", monospace;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    flex-shrink:0;
  }
  .scenario-row .label{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .scenario-row[data-kind="favorable"]{ border-color: var(--favorable); }
  .scenario-row[data-kind="favorable"] .arrow, .scenario-row[data-kind="favorable"] .kind-word{ color: var(--favorable); }
  .scenario-row[data-kind="stable"]{ border-color: var(--stable); }
  .scenario-row[data-kind="stable"] .arrow, .scenario-row[data-kind="stable"] .kind-word{ color: var(--stable); }
  .scenario-row[data-kind="degrade"]{ border-color: var(--degrade); }
  .scenario-row[data-kind="degrade"] .arrow, .scenario-row[data-kind="degrade"] .kind-word{ color: var(--degrade); }

  .cta{
    font-family: "JetBrains Mono", monospace;
    font-weight:700;
    font-size: 34px;
    color: var(--gold);
    margin-top:6px;
  }

  .footer{
    position:absolute;
    bottom:52px; left:84px;
    display:flex;
    align-items:baseline;
    gap:14px;
    font-size:22px;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .footer .tagline{ color: var(--gold); font-weight:700; }
  .footer .sep{ color: var(--paper-dim); opacity:.5; }
  .footer .url{ color: var(--paper-dim); }
  .delta-badge[data-kind="positif"]{ --accent: var(--favorable); }
  .delta-badge[data-kind="negatif"]{ --accent: var(--degrade); }
</style></head>
<body>
  <div class="masthead">
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M57,96 L57,70 Q57,65 60,63" stroke="#cf9d4c"/>
      <path d="M63,96 L63,70 Q63,65 60,63" stroke="#cf9d4c"/>
      <path d="M60,63 L60,55" stroke="#cf9d4c"/>
      <path d="M60,55 L60,31" stroke="#6f8fae"/>
      <path d="M55.8,38.9 L60,31 L64.2,38.9" stroke="#6f8fae"/>
      <path d="M60,63 L53.4,56.9" stroke="#cf9d4c"/>
      <path d="M53.4,56.9 L34,39" stroke="#5e9c78"/>
      <path d="M36.97,47.5 L34,39 L42.69,41.3" stroke="#5e9c78"/>
      <path d="M60,63 L66.6,56.9" stroke="#cf9d4c"/>
      <path d="M66.6,56.9 L86,39" stroke="#bd6248"/>
      <path d="M83.03,47.5 L86,39 L77.31,41.3" stroke="#bd6248"/>
    </svg>
    <div class="word">Scéna<span class="rio">rio</span></div>
    <div class="eyebrow">Sujet du jour</div>
  </div>

  <div class="headline">__TITLE__</div>

  <div class="context">__CONTEXT__</div>

  <div class="scenarios">
    __SCENARIO_ROWS__
  </div>

  <div class="cta">👉 Le scénario le plus probable en bio</div>

  <div class="footer"><span class="tagline">Le futur en 3 scénarios</span><span class="sep">·</span><span class="url">lesscenarios.fr</span></div>
</body></html>
