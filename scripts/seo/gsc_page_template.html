<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord SEO — Scénario</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#10151c">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #10151c;
    --surface: #1a212b;
    --surface-2: #212a35;
    --hairline: #2c3644;
    --paper: #ece7da;
    --paper-dim: #a9a89c;
    --gold: #cf9d4c;
    --favorable: #5e9c78;
    --stable: #6f8fae;
    --degrade: #bd6248;
  }

  *,*::before,*::after{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background: var(--ink);
    color: var(--paper);
    font-family: "Inter", system-ui, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a{ color: inherit; }

  ::selection{ background: var(--gold); color: var(--ink); }

  :focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }

  .wrap{
    max-width: 920px;
    margin: 0 auto;
    padding: 0 24px;
  }

  header.masthead{
    border-bottom: 1px solid var(--hairline);
    padding: 28px 0 22px;
  }

  .masthead-row{
    display:flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .wordmark{
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 1.5rem;
    letter-spacing: 0.01em;
    text-decoration: none;
  }

  .wordmark span{ color: var(--gold); }

  .brand-rio{ color: var(--gold); }

  .brand{
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .brand-row{
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    row-gap: 4px;
    gap: 11px;
  }


  .brand-mark{
    width: 30px;
    height: 30px;
    display: block;
    flex: none;
  }

  nav.topnav{
    background: var(--surface);
    border-bottom: 1px solid var(--hairline);
  }

  nav.topnav .wrap{
    display: flex;
    gap: 16px;
    padding: 12px 24px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  nav.topnav .wrap::-webkit-scrollbar{ display: none; }

  .topnav a{ flex-shrink: 0; }

  .topnav a{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: "JetBrains Mono", monospace;
    font-size: 0.76rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--paper-dim);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
  }

  .topnav a svg{ display: block; flex-shrink: 0; }

  .topnav a:hover{ color: var(--paper); }

  .topnav a[aria-current="page"]{
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  /* ---- Tableau de bord SEO (page privée générée par scripts/seo/gsc_report.py) ---- */
  .hero{ padding: 48px 0 28px; border-bottom: 1px solid var(--hairline); }
  .eyebrow{ font-family:"JetBrains Mono",monospace; font-size:.78rem; text-transform:uppercase; letter-spacing:.14em; color:var(--gold); margin:0 0 14px; }
  h1{ font-family:"Fraunces",serif; font-weight:600; font-size:clamp(1.9rem,4.6vw,2.9rem); line-height:1.1; margin:0 0 12px; }
  .dek{ color:var(--paper-dim); max-width:62ch; margin:0; font-size:1.02rem; }
  .stamp{ font-family:"JetBrains Mono",monospace; font-size:.76rem; color:var(--paper-dim); margin:14px 0 0; }
  section.block{ padding: 34px 0; border-bottom: 1px solid var(--hairline); }
  section.block:last-of-type{ border-bottom:none; }
  .label{ font-family:"JetBrains Mono",monospace; font-size:.78rem; text-transform:uppercase; letter-spacing:.14em; color:var(--gold); margin:0 0 8px; }
  h2{ font-family:"Fraunces",serif; font-size:1.45rem; font-weight:600; margin:0 0 16px; }
  p{ color:var(--paper-dim); margin:0 0 12px; max-width:70ch; }
  strong{ color:var(--paper); font-weight:500; }
  code{ font-family:"JetBrains Mono",monospace; font-size:.82em; color:var(--paper); background:var(--surface-2); padding:1px 5px; border-radius:4px; }
  .verdict{ display:flex; gap:14px; align-items:flex-start; background:var(--surface); border:1px solid var(--hairline); border-left:4px solid var(--accent); border-radius:10px; padding:18px 20px; --accent:var(--stable); }
  .verdict.is-critique{ --accent:var(--degrade); } .verdict.is-moyen{ --accent:var(--gold); } .verdict.is-bon{ --accent:var(--favorable); }
  .verdict-tag{ font-family:"JetBrains Mono",monospace; font-size:.74rem; text-transform:uppercase; letter-spacing:.1em; color:var(--accent); white-space:nowrap; padding-top:3px; }
  .verdict p{ margin:0; color:var(--paper); }
  .kpis{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:0 0 4px; }
  @media (min-width: 560px){ .kpis{ grid-template-columns:repeat(3,1fr); } }
  @media (min-width: 980px){ .kpis{ grid-template-columns:repeat(6,1fr); } }
  .kpi{ background:var(--surface); border:1px solid var(--hairline); border-radius:10px; padding:14px 16px; }
  .kpi-val{ font-family:"Fraunces",serif; font-weight:700; font-size:1.7rem; line-height:1.1; color:var(--paper); }
  .kpi-name{ font-family:"JetBrains Mono",monospace; font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:var(--paper-dim); margin-top:6px; }
  .kpi-note{ font-size:.78rem; color:var(--paper-dim); margin-top:4px; }
  .kpi.is-bad .kpi-val{ color:var(--degrade); } .kpi.is-good .kpi-val{ color:var(--favorable); }
  .todo{ display:grid; gap:12px; }
  .todo-item{ background:var(--surface); border:1px solid var(--hairline); border-left:4px solid var(--accent); border-radius:10px; padding:14px 18px; --accent:var(--stable); }
  .todo-item.p1{ --accent:var(--degrade); } .todo-item.p2{ --accent:var(--gold); }
  .todo-prio{ font-family:"JetBrains Mono",monospace; font-size:.7rem; text-transform:uppercase; letter-spacing:.1em; color:var(--accent); margin:0 0 4px; }
  .todo-item p{ margin:0; color:var(--paper); max-width:none; font-size:.95rem; }
  .todo-item .how{ color:var(--paper-dim); margin-top:6px; font-size:.88rem; }
  .todo-item.st-corrige{ --accent:var(--favorable); } .todo-item.st-a_faire{ --accent:var(--gold); } .todo-item.st-proprietaire{ --accent:var(--degrade); } .todo-item.st-ecarte{ --accent:var(--paper-dim); }
  .todo-prio .pill{ margin-right:10px; }
  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .col{ background:var(--surface); border:1px solid var(--hairline); border-top:3px solid var(--accent); border-radius:10px; padding:18px 20px; --accent:var(--favorable); }
  .col.is-bad{ --accent:var(--degrade); }
  .col h3{ font-family:"JetBrains Mono",monospace; font-size:.78rem; text-transform:uppercase; letter-spacing:.1em; color:var(--accent); margin:0 0 12px; font-weight:500; }
  .col ul{ list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  .col li{ position:relative; padding-left:22px; color:var(--paper); font-size:.93rem; }
  .col li::before{ content:"✓"; position:absolute; left:0; color:var(--favorable); font-family:"JetBrains Mono",monospace; }
  .col.is-bad li::before{ content:"✕"; color:var(--degrade); }
  .col.is-unknown{ --accent:var(--gold); } .col.is-unknown li::before{ content:"?"; color:var(--gold); }
  .col li.empty{ color:var(--paper-dim); } .col li.empty::before{ content:"–"; color:var(--paper-dim); }
  .list{ list-style:none; margin:0; padding:0; display:grid; gap:0; background:var(--surface); border:1px solid var(--hairline); border-radius:10px; overflow:hidden; }
  .list li{ display:grid; grid-template-columns:1fr auto; gap:6px 16px; padding:10px 16px; border-top:1px solid var(--hairline); font-size:.9rem; color:var(--paper); }
  .list li:first-child{ border-top:none; }
  .list .meta{ font-family:"JetBrains Mono",monospace; font-size:.76rem; color:var(--paper-dim); white-space:nowrap; text-align:right; }
  .list .url{ font-family:"JetBrains Mono",monospace; font-size:.8rem; overflow-wrap:anywhere; }
  .pill{ display:inline-block; font-family:"JetBrains Mono",monospace; font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; padding:2px 8px; border-radius:100px; border:1px solid var(--hairline); margin-right:8px; }
  .pill.ok{ color:var(--favorable); border-color:var(--favorable); } .pill.bad{ color:var(--degrade); border-color:var(--degrade); } .pill.mid{ color:var(--gold); border-color:var(--gold); }
  footer{ border-top:1px solid var(--hairline); padding:28px 0 44px; }
  footer p{ font-size:.84rem; max-width:62ch; margin:0 0 8px; }
  @media (max-width: 760px){ .duo{ grid-template-columns:1fr; } .verdict{ flex-direction:column; gap:6px; } .list li{ grid-template-columns:1fr; } .list .meta{ text-align:left; white-space:normal; } }
</style>
</head>
<body>
