<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ce qui va arriver — calendrier illustré (A)</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10151c; --surface:#1a212b; --surface-2:#212a35; --hairline:#2c3644;
  --paper:#ece7da; --paper-dim:#a9a89c; --gold:#cf9d4c;
  --tile:76px; --gap:20px;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font-family:Inter,system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding:0 24px}

.topnav{position:sticky;top:0;z-index:10;background:var(--ink);border-bottom:1px solid var(--hairline)}
.topnav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px}
.wordmark{font-family:Fraunces,serif;font-weight:600;font-size:1.35rem;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.wordmark span{color:var(--gold)}
.topnav nav{display:flex;gap:6px;font-size:.88rem}
.topnav nav a{text-decoration:none;color:var(--paper-dim);padding:0 8px;min-height:44px;display:inline-flex;align-items:center;border-bottom:2px solid transparent}
.topnav nav a[aria-current="page"]{color:var(--paper);border-bottom-color:var(--gold)}

.section-label{font-family:"JetBrains Mono",monospace;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.section-label::before{content:"";width:22px;height:1px;background:var(--gold)}
h1{font-family:Fraunces,serif;font-weight:500;font-size:clamp(1.8rem,5vw,2.5rem);line-height:1.15;margin:0 0 14px}
h2{font-family:Fraunces,serif;font-weight:500;font-size:1.15rem;line-height:1.3;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--paper-dim);margin:0;max-width:60ch}
main{padding:32px 0 64px}

/* chronologie */
.tl{position:relative;margin-top:30px}
.tl::before{content:"";position:absolute;left:calc(var(--tile) / 2);top:0;bottom:0;width:2px;margin-left:-1px;
  background:linear-gradient(to bottom,var(--gold),#6b5430 45%,var(--hairline));border-radius:2px}
.periode{margin:0}
.periode + .periode{margin-top:10px}
.periode > .section-label{position:sticky;top:56px;z-index:5;background:var(--ink);
  margin:0 0 4px calc(var(--tile) + var(--gap));padding:8px 0}
.periode > .section-label::after{content:"";position:absolute;left:calc(-1 * (var(--tile) / 2 + var(--gap)) - 6px);top:50%;
  width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--ink);border:2px solid var(--gold)}

.signal{display:grid;grid-template-columns:var(--tile) 1fr;gap:var(--gap);padding:8px 0 12px;align-items:start}

/* tuile calendrier */
.tuile{position:relative;z-index:1;width:var(--tile);border-radius:12px;overflow:hidden;text-align:center;
  background:var(--surface-2);border:1px solid #3a4656;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.tuile .haut{display:block;background:var(--gold);color:var(--ink);font-family:"JetBrains Mono",monospace;font-weight:500;
  font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 2px;line-height:1.2;white-space:nowrap}
.tuile .gros{display:block;font-family:Fraunces,serif;font-weight:600;font-size:2rem;line-height:1;padding:9px 2px 4px;color:var(--paper)}
.tuile .bas{display:block;font-family:"JetBrains Mono",monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-dim);padding:0 2px 8px;line-height:1.2}
.tuile .gros.moy{font-size:1.45rem;padding-top:11px}
.tuile .gros.moy:last-child{padding-bottom:12px}
.tuile .gros.sans-bas{padding-bottom:10px}
.tuile.flou{background:var(--surface);border:1.5px dashed var(--gold)}
.tuile.flou .haut{background:transparent;color:var(--gold);padding-top:6px}

/* carte */
.carte{background:var(--surface);border:1px solid var(--hairline);border-radius:14px;padding:14px 18px 6px;min-width:0}
.entete{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:10px}
.pastille{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--hairline);
  font-family:"JetBrains Mono",monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--paper)}
.pastille svg{width:24px;height:24px;flex:none;stroke:var(--gold);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.jauge{display:inline-flex;align-items:center;gap:10px;font-family:"JetBrains Mono",monospace;font-size:.76rem;color:var(--paper-dim);white-space:nowrap}
.jauge .piste{position:relative;width:96px;height:6px;border-radius:6px;background:var(--hairline);overflow:hidden}
.jauge .piste i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#8a6a33,var(--gold))}
.jauge b{font-weight:500;color:var(--paper)}
.comm{margin:0 0 8px;color:var(--paper);max-width:62ch;font-size:.95rem}
.eds{margin:0;padding:8px 0 0;list-style:none;font-size:.86rem;color:var(--paper-dim);border-top:1px solid var(--hairline)}
.eds b{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-dim);display:block;margin-bottom:0}
.eds a{display:flex;align-items:center;min-height:44px;color:var(--gold);text-underline-offset:3px;padding:2px 0}
.eds a .d{color:var(--paper-dim);margin-left:.4em;white-space:nowrap}
.eds a span.t{min-width:0}

.pied{margin:32px 0 0;padding:14px 16px;border-left:3px solid var(--gold);background:var(--surface);border-radius:0 8px 8px 0;font-size:.92rem;max-width:64ch}
.vide{padding:22px;border:1px dashed var(--hairline);border-radius:10px;color:var(--paper-dim);text-align:center;margin-top:30px}
.bandeau-maquette{background:var(--surface-2);border-bottom:1px solid var(--hairline);font-size:.78rem;color:var(--paper-dim);padding:2px 0}
.bandeau-maquette .wrap{display:flex;gap:2px 10px;flex-wrap:wrap;align-items:center}
.bandeau-maquette a{color:var(--gold);display:inline-flex;align-items:center;min-height:44px;padding:0 4px}

/* apparition douce */
@keyframes apparait{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes remplit{from{width:0}}
.signal{animation:apparait .5s ease both;animation-delay:calc(var(--i,0) * 70ms)}
.jauge .piste i{animation:remplit .9s ease both;animation-delay:calc(var(--i,0) * 70ms + 250ms)}
@media (prefers-reduced-motion:reduce){
  .signal,.jauge .piste i{animation:none}
}

@media (max-width:640px){
  :root{--tile:62px;--gap:14px}
  .wrap{padding:0 16px}
  main{padding:24px 0 52px}
  .topnav nav{gap:0;font-size:.82rem}
  .tuile{border-radius:10px}
  .tuile .gros{font-size:1.6rem;padding-top:7px}
  .tuile .gros.moy{font-size:1.15rem;padding-top:9px}
  .tuile .haut,.tuile .bas{font-size:.55rem;letter-spacing:.05em}
  .carte{padding:12px 14px 4px}
  .jauge .piste{width:72px}
}
</style>
</head>
<body>
<div class="bandeau-maquette"><div class="wrap">
  <span><b>Calendrier illustré (A)</b> — états :</span>
  <a href="?etat=reel">réel</a> · <a href="?etat=vide">aucun signal</a> · <a href="?etat=long">texte long</a>
</div></div>

<header class="topnav"><div class="wrap">
  <a class="wordmark" href="#">Scénario<span>.</span></a>
  <nav aria-label="Navigation principale">
    <a href="#">Éditions</a><a href="#" aria-current="page">À venir</a><a href="#">Le projet</a>
  </nav>
</div></header>

<main><div class="wrap" id="app"></div></main>

<script>
(function(){
  var AUJ = new Date("2026-11-10");
  var MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

  // Éditions (titres réels, liens vers les archives).
  var ED = {
    "2026-09-13":{t:"Budget 2027 : le gouvernement Lecornu va-t-il tenir cet automne ?", d:"13 septembre"},
    "2026-10-27":{t:"Éthiopie-Érythrée : vers une nouvelle guerre régionale ?", d:"27 octobre"},
    "2026-11-04":{t:"Facturation électronique : les entreprises prêtes pour l'échéance de décembre ?", d:"4 novembre"},
    "2026-11-06":{t:"Robotique : les robots vont-ils vraiment entrer dans notre quotidien ?", d:"6 novembre"},
    "2026-11-07":{t:"Netflix : le nouveau cinéma mondial ?", d:"7 novembre"},
    "2026-11-08":{t:"Sport : peut-il rester humain face à l'IA et aux données ?", d:"8 novembre"}
  };

  // date = date limite (tri) ; quand = texte affiché ; periode = regroupement.
  var SIGNAUX = [
    {date:"2026-11-30", quand:"30 novembre", precis:true,
     titre:"Un cessez-le-feu est-il annoncé entre l'Éthiopie et l'Érythrée ?",
     comm:"Depuis la rupture diplomatique du 1er octobre et les frappes de drones près d'Adigrat, la région craint un retour à la guerre de 2020-2022. Une annonce sous médiation régionale calmerait le jeu, sans régler le fond du conflit.",
     eds:["2026-10-27"]},
    {date:"2026-11-30", quand:"Fin novembre", precis:false,
     titre:"Quel est le taux de désignation officiel publié pour la facturation électronique ?",
     comm:"La DGFiP publie ce taux fin novembre. On regarde aussi si les factures rejetées augmentent à l'approche de l'échéance de décembre.",
     eds:["2026-11-04"]},
    {date:"2026-12-31", quand:"D'ici le 31 décembre", precis:false,
     titre:"Le budget 2027 est-il voté sans que le gouvernement soit renversé ?",
     comm:"Le gouvernement Lecornu doit faire adopter le budget cet automne. Une motion de censure est un vote des députés qui peut le renverser. Si elle aboutit, ou si le vote est repoussé, c'est une crise budgétaire.",
     eds:["2026-09-13"]},
    {date:"2026-12-31", quand:"D'ici le 31 décembre", precis:false,
     titre:"Les premiers robots NEO sont-ils livrés à des particuliers américains ?",
     comm:"Il s'agit du robot NEO de 1X, affiché à 20 000 dollars. On attend la confirmation de premières livraisons effectives.",
     eds:["2026-11-06"]},
    {date:"2026-12-31", quand:"D'ici fin 2026", precis:false,
     titre:"Les clubs sportifs se mettent-ils en conformité avec le règlement européen sur l'IA ?",
     comm:"On suit la mise en conformité des clubs, et les premières décisions de la CNIL sur les contrats de joueurs.",
     eds:["2026-11-08"]},
    {date:"2027-02-01", quand:"Février 2027", precis:false,
     titre:"Quelles recettes pour « Narnia : Le Neveu du magicien » lors de son premier week-end ?",
     comm:"On regarde le niveau des recettes au box-office mondial lors du premier week-end d'exploitation.",
     eds:["2026-11-07"]}
  ];

  var etat = new URLSearchParams(location.search).get("etat") || "reel";
  var DATA = SIGNAUX.slice();
  if (etat === "vide") DATA = [];
  if (etat === "long") {
    DATA = SIGNAUX.slice();
    DATA[0] = Object.assign({}, DATA[0], {
      titre:"Un cessez-le-feu durable et vérifiable est-il annoncé, sous l'égide de l'Union africaine et de plusieurs médiateurs régionaux, entre l'Éthiopie et l'Érythrée ?",
      eds:["2026-10-27","2026-09-13","2026-11-06"]});
  }

  var ICONES = {
    "Géopolitique":'<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M5 7.5c2 1 4.3 1.5 7 1.5s5-.5 7-1.5M5 16.5c2-1 4.3-1.5 7-1.5s5 .5 7 1.5"/>',
    "Économie":'<path d="M4 4v16h16"/><path d="M8 15l3.5-4 3 2.5L20 7"/><path d="M16 7h4v4"/>',
    "Politique":'<path d="M3 9l9-5 9 5z"/><path d="M5.5 12v6M10 12v6M14 12v6M18.5 12v6M3 20.5h18"/>',
    "Technologie":'<rect x="7" y="7" width="10" height="10" rx="2"/><path d="M10 10.5h4v3h-4zM9.5 3.5v3.5M14.5 3.5v3.5M9.5 17v3.5M14.5 17v3.5M3.5 9.5H7M3.5 14.5H7M17 9.5h3.5M17 14.5h3.5"/>',
    "Sport":'<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5.5a2.5 2.5 0 0 0 2.700 3.800M16 6h2.5a2.5 2.5 0 0 1-2.700 3.800"/><path d="M12 13v4M9 20h6M10 17h4"/>',
    "Culture":'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9l5 3-5 3z"/><path d="M7 5v14M17 5v14" opacity=".35"/>'
  };
  // tuile : haut / gros / bas ; flou = date approximative.
  var META = [
    {dom:"Géopolitique", tuile:{h:"nov.", g:"30"}},
    {dom:"Économie", tuile:{h:"Fin", g:"nov.", m:1}, flou:1},
    {dom:"Politique", tuile:{h:"D'ici le", g:"31", b:"déc."}, flou:1},
    {dom:"Technologie", tuile:{h:"D'ici le", g:"31", b:"déc."}, flou:1},
    {dom:"Sport", tuile:{h:"D'ici fin", g:"2026", m:1}, flou:1},
    {dom:"Culture", tuile:{h:"2027", g:"Fév.", m:1}, flou:1}
  ];
  DATA.forEach(function(s,i){ var m = META[SIGNAUX.findIndex(function(x){return x.titre===s.titre || x.eds[0]===s.eds[0];})] || META[i]; s.meta = m; });

  function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}); }
  function periode(d){
    var x = new Date(d);
    if (x.getFullYear()===AUJ.getFullYear()) return MOIS[x.getMonth()].charAt(0).toUpperCase()+MOIS[x.getMonth()].slice(1)+" "+x.getFullYear();
    return "En "+x.getFullYear();
  }
  function jours(s){ return Math.round((new Date(s.date)-AUJ)/86400000); }
  function reste(s){
    var j = jours(s);
    if (j < 0) return "date passée";
    if (j === 0) return "aujourd'hui";
    return "dans "+j+" jour"+(j>1?"s":"");
  }
  function tuile(s){
    var t = s.meta.tuile;
    var cls = "tuile"+(s.meta.flou?" flou":"");
    return '<div class="'+cls+'" aria-hidden="true"><span class="haut">'+esc(t.h)+'</span><span class="gros'+(t.m?' moy':'')+(t.b?'':' sans-bas')+'">'+esc(t.g)+'</span>'+(t.b?'<span class="bas">'+esc(t.b)+'</span>':'')+'</div>';
  }
  function jauge(s){
    var j = Math.max(0, jours(s)), p = Math.max(4, Math.round((1 - Math.min(j,90)/90)*100));
    return '<span class="jauge" title="Barre sur 90 jours : plus elle est remplie, plus l\'échéance est proche"><span class="piste" aria-hidden="true"><i style="width:'+p+'%"></i></span><b>'+reste(s)+'</b></span>';
  }

  var app = document.getElementById("app");
  var h = '<p class="section-label">À venir</p><h1>Ce qui va arriver</h1>';
  h += '<p class="lead">Les rendez-vous à surveiller, relevés dans nos éditions, du plus proche au plus lointain.</p>';
  if (!DATA.length){
    h += '<div class="vide">Aucun rendez-vous à surveiller pour le moment.</div>';
  } else {
    var groupes = {}, ordre = [], n = 0;
    DATA.slice().sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(s){
      var p = periode(s.date); if(!groupes[p]){groupes[p]=[]; ordre.push(p);} groupes[p].push(s);
    });
    h += '<div class="tl">';
    ordre.forEach(function(p){
      h += '<section class="periode" aria-label="'+esc(p)+'"><p class="section-label">'+esc(p)+'</p>';
      groupes[p].forEach(function(s){
        h += '<article class="signal" style="--i:'+(n++)+'">'+tuile(s)+'<div class="carte">'+
             '<div class="entete"><span class="pastille"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONES[s.meta.dom]+'</svg>'+esc(s.meta.dom)+'</span>'+jauge(s)+'</div>'+
             '<h2><span class="sr" style="position:absolute;left:-9999px">'+esc(s.quand)+' : </span>'+esc(s.titre).replace(/ \?/g,'\u00a0?').replace(/week-end/g,'week\u2011end')+'</h2><p class="comm">'+esc(s.comm)+'</p>'+
             '<ul class="eds"><b>'+(s.eds.length>1?'Éditions concernées':'Édition concernée')+'</b>'+
             s.eds.map(function(k){ var e = ED[k] || {t:"…", d:"…"};
               return '<li><a href="../../archives/'+k+'.html"><span class="t">'+esc(e.t)+'<span class="d">— '+e.d+'</span></span></a></li>'; }).join("")+
             '</ul></div></article>';
      });
      h += '</section>';
    });
    h += '</div><p class="pied">Ces rendez-vous sont des repères, pas des prévisions. Nous ne recalculons pas de probabilités ici : à chacun de se faire son idée.</p>';
  }
  app.innerHTML = h;
})();
</script>
</body>
</html>
