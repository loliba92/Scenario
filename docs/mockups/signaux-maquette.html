<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ce qui va arriver — maquette v3</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10151c; --surface:#1a212b; --surface-2:#212a35; --hairline:#2c3644;
  --paper:#ece7da; --paper-dim:#a9a89c; --gold:#cf9d4c;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font-family:Inter,system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:860px;margin:0 auto;padding:0 24px}

.topnav{position:sticky;top:0;z-index:10;background:var(--ink);border-bottom:1px solid var(--hairline)}
.topnav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px}
.wordmark{font-family:Fraunces,serif;font-weight:600;font-size:1.35rem;text-decoration:none}
.wordmark span{color:var(--gold)}
.topnav nav{display:flex;gap:18px;font-size:.88rem}
.topnav nav a{text-decoration:none;color:var(--paper-dim);padding:6px 0;border-bottom:2px solid transparent}
.topnav nav a[aria-current="page"]{color:var(--paper);border-bottom-color:var(--gold)}

.section-label{font-family:"JetBrains Mono",monospace;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.section-label::before{content:"";width:22px;height:1px;background:var(--gold)}
h1{font-family:Fraunces,serif;font-weight:500;font-size:clamp(1.8rem,5vw,2.5rem);line-height:1.15;margin:0 0 14px}
h2{font-family:Fraunces,serif;font-weight:500;font-size:1.2rem;line-height:1.3;margin:0 0 8px}
.lead{color:var(--paper-dim);margin:0;max-width:60ch}
main{padding:36px 0 72px}

.periode{margin:40px 0 0}
.periode > .section-label{position:sticky;top:56px;background:var(--ink);padding:8px 0;margin:0 0 6px;z-index:5}

.signal{display:grid;grid-template-columns:150px 1fr;gap:20px;padding:20px 0;border-top:1px solid var(--hairline)}
.quand{font-family:"JetBrains Mono",monospace;font-size:.85rem;color:var(--paper)}
.quand small{display:block;margin-top:3px;font-size:.74rem;color:var(--paper-dim)}
.signal h2{margin:0 0 6px}
.comm{margin:0 0 12px;color:var(--paper);max-width:62ch;font-size:.96rem}
.eds{margin:0;padding:0;list-style:none;font-size:.86rem;color:var(--paper-dim)}
.eds b{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-dim);display:block;margin-bottom:4px}
.eds li{margin:2px 0}
.eds a{color:var(--gold);text-underline-offset:3px}
.pied{margin-top:40px;padding:14px 16px;border-left:3px solid var(--gold);background:var(--surface);border-radius:0 8px 8px 0;font-size:.92rem;max-width:64ch}
.vide{padding:22px;border:1px dashed var(--hairline);border-radius:10px;color:var(--paper-dim);text-align:center;margin-top:30px}
.bandeau-maquette{background:var(--surface-2);border-bottom:1px solid var(--hairline);font-size:.78rem;color:var(--paper-dim);padding:6px 0}
.bandeau-maquette .wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bandeau-maquette a{color:var(--gold)}

@media (max-width:640px){
  .wrap{padding:0 16px}
  main{padding:26px 0 56px}
  .topnav nav{gap:12px;font-size:.82rem}
  .signal{grid-template-columns:1fr;gap:8px}
  .quand small{display:inline;margin-left:8px}
}
</style>
</head>
<body>
<div class="bandeau-maquette"><div class="wrap">
  <span><b>Maquette v3</b> — états :</span>
  <a href="?etat=reel">réel</a> · <a href="?etat=vide">aucun signal</a> · <a href="?etat=long">texte long</a>
</div></div>

<header class="topnav"><div class="wrap">
  <a class="wordmark" href="#">Scénario<span>.</span></a>
  <nav aria-label="Navigation principale">
    <a href="#">Éditions</a><a href="#" aria-current="page">À venir</a><a href="#">Le projet</a>
  </nav>
</div></header>

<main><div class="wrap" id="app"></div></main>

<script>
(function(){
  var AUJ = new Date("2026-11-10");
  var MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

  // Éditions (titres réels, liens vers les archives).
  var ED = {
    "2026-09-13":{t:"Budget 2027 : le gouvernement Lecornu va-t-il tenir cet automne ?", d:"13 septembre"},
    "2026-10-27":{t:"Éthiopie-Érythrée : vers une nouvelle guerre régionale ?", d:"27 octobre"},
    "2026-11-04":{t:"Facturation électronique : les entreprises prêtes pour l'échéance de décembre ?", d:"4 novembre"},
    "2026-11-06":{t:"Robotique : les robots vont-ils vraiment entrer dans notre quotidien ?", d:"6 novembre"},
    "2026-11-07":{t:"Netflix : le nouveau cinéma mondial ?", d:"7 novembre"},
    "2026-11-08":{t:"Sport : peut-il rester humain face à l'IA et aux données ?", d:"8 novembre"}
  };

  // date = date limite (tri) ; quand = texte affiché ; periode = regroupement.
  var SIGNAUX = [
    {date:"2026-11-30", quand:"30 novembre", precis:true,
     titre:"Un cessez-le-feu est-il annoncé entre l'Éthiopie et l'Érythrée ?",
     comm:"Depuis la rupture diplomatique du 1er octobre et les frappes de drones près d'Adigrat, la région craint un retour à la guerre de 2020-2022. Une annonce sous médiation régionale calmerait le jeu, sans régler le fond du conflit.",
     eds:["2026-10-27"]},
    {date:"2026-11-30", quand:"Fin novembre", precis:false,
     titre:"Quel est le taux de désignation officiel publié pour la facturation électronique ?",
     comm:"La DGFiP publie ce taux fin novembre. On regarde aussi si les factures rejetées augmentent à l'approche de l'échéance de décembre.",
     eds:["2026-11-04"]},
    {date:"2026-12-31", quand:"D'ici le 31 décembre", precis:false,
     titre:"Le budget 2027 est-il voté sans que le gouvernement soit renversé ?",
     comm:"Le gouvernement Lecornu doit faire adopter le budget cet automne. Une motion de censure est un vote des députés qui peut le renverser. Si elle aboutit, ou si le vote est repoussé, c'est une crise budgétaire.",
     eds:["2026-09-13"]},
    {date:"2026-12-31", quand:"D'ici le 31 décembre", precis:false,
     titre:"Les premiers robots NEO sont-ils livrés à des particuliers américains ?",
     comm:"Il s'agit du robot NEO de 1X, affiché à 20 000 dollars. On attend la confirmation de premières livraisons effectives.",
     eds:["2026-11-06"]},
    {date:"2026-12-31", quand:"D'ici fin 2026", precis:false,
     titre:"Les clubs sportifs se mettent-ils en conformité avec le règlement européen sur l'IA ?",
     comm:"On suit la mise en conformité des clubs, et les premières décisions de la CNIL sur les contrats de joueurs.",
     eds:["2026-11-08"]},
    {date:"2027-02-01", quand:"Février 2027", precis:false,
     titre:"Quelles recettes pour « Narnia : Le Neveu du magicien » lors de son premier week-end ?",
     comm:"On regarde le niveau des recettes au box-office mondial lors du premier week-end d'exploitation.",
     eds:["2026-11-07"]}
  ];

  var etat = new URLSearchParams(location.search).get("etat") || "reel";
  var DATA = SIGNAUX.slice();
  if (etat === "vide") DATA = [];
  if (etat === "long") {
    DATA = SIGNAUX.slice();
    DATA[0] = Object.assign({}, DATA[0], {
      titre:"Un cessez-le-feu durable et vérifiable est-il annoncé, sous l'égide de l'Union africaine et de plusieurs médiateurs régionaux, entre l'Éthiopie et l'Érythrée ?",
      eds:["2026-10-27","2026-09-13","2026-11-06"]});
  }

  function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}); }
  function periode(d){
    var x = new Date(d), j = Math.round((x-AUJ)/86400000);
    if (x.getFullYear()===AUJ.getFullYear()) return MOIS[x.getMonth()].charAt(0).toUpperCase()+MOIS[x.getMonth()].slice(1)+" "+x.getFullYear();
    return "En "+x.getFullYear();
  }
  function reste(s){
    var j = Math.round((new Date(s.date)-AUJ)/86400000);
    if (j < 0) return "date passée";
    if (j === 0) return "aujourd'hui";
    return "dans "+j+" jour"+(j>1?"s":"");
  }

  var app = document.getElementById("app");
  var h = '<p class="section-label">À venir</p><h1>Ce qui va arriver</h1>';
  h += '<p class="lead">Les rendez-vous à surveiller, relevés dans nos éditions, du plus proche au plus lointain.</p>';
  if (!DATA.length){
    h += '<div class="vide">Aucun rendez-vous à surveiller pour le moment.</div>';
  } else {
    var groupes = {}, ordre = [];
    DATA.slice().sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(s){
      var p = periode(s.date); if(!groupes[p]){groupes[p]=[]; ordre.push(p);} groupes[p].push(s);
    });
    ordre.forEach(function(p){
      h += '<section class="periode" aria-label="'+esc(p)+'"><p class="section-label">'+esc(p)+'</p>';
      groupes[p].forEach(function(s){
        h += '<article class="signal"><div class="quand">'+esc(s.quand)+'<small>'+reste(s)+'</small></div><div>'+
             '<h2>'+esc(s.titre)+'</h2><p class="comm">'+esc(s.comm)+'</p>'+
             '<ul class="eds"><b>'+(s.eds.length>1?'Éditions concernées':'Édition concernée')+'</b>'+
             s.eds.map(function(k){ var e = ED[k] || {t:"…", d:"…"};
               return '<li><a href="../../archives/'+k+'.html">'+esc(e.t)+'</a> — '+e.d+'</li>'; }).join("")+
             '</ul></div></article>';
      });
      h += '</section>';
    });
    h += '<p class="pied">Ces rendez-vous sont des repères, pas des prévisions. Nous ne recalculons pas de probabilités ici : à chacun de se faire son idée.</p>';
  }
  app.innerHTML = h;
})();
</script>
</body>
</html>
