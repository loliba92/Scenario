name: Événements à surveiller

# Point quotidien déclenché par cron-job.org (event_type : trigger-signaux, ou workflow_dispatch).
#  1. data/signaux-rapport.md : contrôle gratuit des échéances de data/signaux.json (scripts/detection/verifier_signaux.py).
#  2. Résultats des rendez-vous échus : scripts/a_venir/verifier_resultats.py (modèle bon marché avec recherche web +
#     confirmation indépendante), puis contrôles stricts en code (scripts/a_venir/controles.py : citations retrouvées dans les
#     pages, chiffres, dates, 2 sources de domaines différents). Rien n'est publié si un seul contrôle échoue.
#     Plafond : 3 rendez-vous par passage. Aucun appel s'il n'y a rien à vérifier.
#  3. Régénération de a-venir.html et de l'encadré de l'accueil (le décompte change chaque jour).
# Secret requis : OPENROUTER_API_KEY.

on:
  repository_dispatch:
    types: [trigger-signaux]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signaux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install beautifulsoup4

      - name: Tests
        run: python3 -m unittest scripts/detection/test_verifier_signaux.py scripts/a_venir/test_generate_a_venir.py scripts/a_venir/test_controles.py scripts/a_venir/test_synchro_sujets.py

      - name: Rapport gratuit des échéances
        run: python3 scripts/detection/verifier_signaux.py --sortie "$RUNNER_TEMP/rapport.md" > /dev/null

      - name: Vérifier les résultats des rendez-vous échus
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Un échec de cette étape ne doit jamais empêcher la mise à jour de la page.
          python3 scripts/a_venir/verifier_resultats.py --sortie "$RUNNER_TEMP/patch.json" --rapport "$RUNNER_TEMP/verification.md" \
            || echo '{"resultats": {}, "journal": {}}' > "$RUNNER_TEMP/patch.json"

      - name: Committer et pousser
        run: |
          git config user.name "scenario-signaux-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/rapport.md" data/signaux-rapport.md
            [ -f "$RUNNER_TEMP/verification.md" ] && cp "$RUNNER_TEMP/verification.md" data/a-venir-verification.md
            python3 scripts/a_venir/appliquer_resultats.py "$RUNNER_TEMP/patch.json"
            python3 scripts/a_venir/synchro_sujets.py
            python3 scripts/a_venir/generate_a_venir.py
            python3 scripts/a_venir/accueil.py
            git add data/ a-venir.html index.html
            if git diff --cached --quiet; then
              echo "Aucun changement."
              exit 0
            fi
            git commit -m "[signaux] point quotidien, résultats vérifiés et page À venir"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "Échec du push après 3 essais." >&2
          exit 1
