name: Événements à surveiller

# Contrôle quotidien des échéances de data/signaux.json (scripts/detection/verifier_signaux.py).
# Déclenché par cron-job.org (event_type : trigger-signaux). Aucun appel payant ni requête externe.
# Écrit data/signaux-rapport.md (gratuit) et data/signaux-verification.md (recherche web, modèle
# bon marché, uniquement pour les événements échus ou à 7 jours ; plafond de 3 par passage).
# Ne modifie ni signaux.json ni les sujets. Secret requis : OPENROUTER_API_KEY.

on:
  repository_dispatch:
    types: [trigger-signaux]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signaux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests
        run: python3 -m unittest scripts/detection/test_verifier_signaux.py scripts/detection/test_verifier_signaux_web.py

      - name: Générer les deux rapports
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/detection/verifier_signaux.py --sortie "$RUNNER_TEMP/rapport.md" > /dev/null
          # Un échec de la recherche web ne doit pas empêcher le rapport gratuit.
          python3 scripts/detection/verifier_signaux_web.py --sortie "$RUNNER_TEMP/verification.md" > /dev/null \
            || echo "Vérification web ignorée (voir journal)."

      - name: Committer et pousser
        run: |
          git config user.name "scenario-signaux-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/rapport.md" data/signaux-rapport.md
            [ -f "$RUNNER_TEMP/verification.md" ] && cp "$RUNNER_TEMP/verification.md" data/signaux-verification.md
            git add data/signaux-*.md
            if git diff --cached --quiet; then
              echo "Aucun changement."
              exit 0
            fi
            git commit -m "[signaux] point quotidien des événements à surveiller"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "Échec du push après 3 essais." >&2
          exit 1
