name: Générer preview édition

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-preview]

permissions:
  contents: write
  issues: write

jobs:
  generate-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q beautifulsoup4

      - name: Generate brief for tomorrow
        run: |
          # Check if API key is available
          if [ -z "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "❌ ERROR: OPENROUTER_API_KEY secret not configured"
            echo "Configure it at: https://github.com/loliba92/Scenario/settings/secrets/actions"
            exit 1
          fi

          cd scripts/edition
          # Get tomorrow's date (YYYY-MM-DD)
          TOMORROW=$(date -u -d '+1 day' '+%Y-%m-%d')
          echo "Generating brief for $TOMORROW..."
          OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" python3 generate_fallback_brief.py --date "$TOMORROW" 2>&1 | tee /tmp/phase1.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Phase 1 failed"
            exit 1
          fi
          echo "✅ Phase 1 successful"

      - name: Generate preview edition
        run: |
          cd scripts/edition
          TOMORROW=$(date -u -d '+1 day' '+%Y-%m-%d')
          echo "Generating preview edition for $TOMORROW..."
          OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" PEXELS_API_KEY="${{ secrets.PEXELS_API_KEY }}" python3 generate_daily_edition.py --brief ../../editorial-briefs/"$TOMORROW".json 2>&1 | tee /tmp/phase2.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Phase 2 failed"
            exit 1
          fi
          echo "✅ Phase 2 successful"

      - name: Copy preview to root
        run: |
          TOMORROW=$(date -u -d '+1 day' '+%Y-%m-%d')
          if [ -f "_prototype-out/$TOMORROW.html" ]; then
            cp "_prototype-out/$TOMORROW.html" "preview.html"
            cp "_prototype-out/$TOMORROW.content.json" ".preview-content.json"
            # Copie persistante datée (jamais écrasée par le run du lendemain,
            # contrairement à .preview-content.json) — c'est celle-ci que
            # post-edition.yml relit le lendemain matin pour PUBLIER le
            # contenu déjà validé ici, au lieu de le régénérer avec un
            # nouvel appel OpenRouter (voir incident du 21 septembre 2026 :
            # avant ce changement, la publication réelle ignorait
            # complètement ce que le preview avait généré et validé).
            mkdir -p editorial-previews
            cp "_prototype-out/$TOMORROW.content.json" "editorial-previews/$TOMORROW.content.json"
            # photo-credits.json n'existe que si une photo Pexels a été
            # trouvée pour ce preview (voir fetch_preview_image()) — jamais
            # bloquant si absent, post-edition.yml retombera alors sur une
            # recherche Pexels normale.
            if [ -f "_prototype-out/$TOMORROW.photo-credits.json" ]; then
              cp "_prototype-out/$TOMORROW.photo-credits.json" "editorial-previews/$TOMORROW.photo-credits.json"
            fi
            echo "✅ Preview files copied"
          else
            echo "❌ Preview HTML not found"
            exit 1
          fi

      - name: Commit preview
        run: |
          git config user.name "Claude Preview Bot"
          git config user.email "noreply@anthropic.com"
          TOMORROW=$(date -u -d '+1 day' '+%Y-%m-%d')
          git add preview.html .preview-content.json "editorial-previews/$TOMORROW.content.json" "editorial-briefs/$TOMORROW.json"
          if [ -f "editorial-previews/$TOMORROW.photo-credits.json" ]; then
            git add "editorial-previews/$TOMORROW.photo-credits.json"
          fi
          git commit -m "Daily preview: $TOMORROW - $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "Nothing to commit"
          # Retry avec rebase en cas de push concurrent (fetch first) — sans
          # ça, un simple conflit de timing avec un autre push sur main fait
          # échouer tout le run (voir incident du 23 septembre 2026 : trois
          # runs successifs rejetés faute de retry, alors qu'un simple
          # rebase aurait suffi).
          pushed=false
          for i in 1 2 3 4 5; do
            if git push origin main; then
              pushed=true
              break
            fi
            echo "Push rejeté (tentative $i/5), rebase et nouvel essai..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          if [ "$pushed" != true ]; then
            echo "❌ Push impossible après 5 tentatives (conflits répétés)"
            exit 1
          fi

      - name: Run editorial critique
        # Revue automatique, contrôles statiques uniquement (voir le
        # docstring de scripts/edition/critique_preview.py) — jamais une
        # porte bloquante du pipeline : si elle échoue, le preview déjà
        # committé à l'étape précédente reste intact, seule la revue
        # automatique manque (l'étape suivante poste une issue de repli
        # dans ce cas plutôt que de rester silencieuse).
        continue-on-error: true
        run: |
          TOMORROW=$(date -u -d '+1 day' '+%Y-%m-%d')
          cd scripts/edition
          OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" python3 critique_preview.py \
            --date "$TOMORROW" \
            --brief "../../editorial-briefs/$TOMORROW.json" \
            --content "../../.preview-content.json" \
            --out /tmp/critique.md \
            --out-json /tmp/critique.json

      - name: Revise brief and regenerate edition if corrections needed
        # Suite directe de la critique ci-dessus, même philosophie (jamais
        # bloquante) : réinjecte les `findings` dans un brief révisé
        # (scripts/edition/revise_brief.py) et relance la rédaction via
        # generate_daily_edition.py plutôt que de patcher .preview-content.json
        # à la main — voir docs/routine-redaction-prompt.md § « edition_
        # precedente et corrections_a_appliquer » pour ce que le modèle en
        # fait. Sans effet (revised=false) si la critique a échoué (pas de
        # critique.json) ou n'a rien à signaler (findings vides) : le preview
        # déjà committé plus haut reste alors la version finale.
        id: revise
        continue-on-error: true
        run: |
          TOMORROW=$(date -u -d '+1 day' '+%Y-%m-%d')
          echo "revised=false" >> "$GITHUB_OUTPUT"
          if [ ! -f /tmp/critique.json ]; then
            echo "Pas de critique.json (étape précédente en échec) — rien à réviser."
            exit 0
          fi
          cd scripts/edition
          if ! python3 revise_brief.py \
            --brief "../../editorial-briefs/$TOMORROW.json" \
            --content "../../.preview-content.json" \
            --critique-json /tmp/critique.json \
            --out /tmp/brief-revise.json; then
            echo "Critique sans finding — rien à réviser."
            exit 0
          fi
          N_FINDINGS=$(python3 -c "import json; print(len(json.load(open('/tmp/brief-revise.json'))['corrections_a_appliquer']))")
          echo "Régénération de l'édition avec $N_FINDINGS correction(s)..."
          OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" PEXELS_API_KEY="${{ secrets.PEXELS_API_KEY }}" python3 generate_daily_edition.py --brief /tmp/brief-revise.json 2>&1 | tee /tmp/phase3.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Régénération échouée — preview non corrigé conservé tel quel"
            exit 0
          fi
          echo "✅ Régénération réussie"
          echo "revised=true" >> "$GITHUB_OUTPUT"
          echo "n_findings=$N_FINDINGS" >> "$GITHUB_OUTPUT"

      - name: Copy and commit corrected preview
        if: steps.revise.outputs.revised == 'true'
        id: revise_commit
        continue-on-error: true
        run: |
          TOMORROW=$(date -u -d '+1 day' '+%Y-%m-%d')
          cp "_prototype-out/$TOMORROW.html" "preview.html"
          cp "_prototype-out/$TOMORROW.content.json" ".preview-content.json"
          cp "_prototype-out/$TOMORROW.content.json" "editorial-previews/$TOMORROW.content.json"
          git config user.name "Claude Preview Bot"
          git config user.email "noreply@anthropic.com"
          git add preview.html .preview-content.json "editorial-previews/$TOMORROW.content.json"
          if ! git commit -m "Preview corrigé automatiquement d'après la critique éditoriale - $TOMORROW"; then
            echo "Contenu identique après régénération — rien à committer."
            exit 0
          fi
          # Retry avec rebase en cas de push concurrent, même logique que
          # l'étape « Commit preview » — sans ça, un conflit de timing fait
          # échouer silencieusement le push (continue-on-error masquait
          # l'échec jusqu'ici, voir incident du 23 septembre 2026 : une
          # correction de critique perdue sans que personne ne le sache).
          pushed=false
          for i in 1 2 3 4 5; do
            if git push origin main; then
              pushed=true
              break
            fi
            echo "Push rejeté (tentative $i/5), rebase et nouvel essai..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          if [ "$pushed" != true ]; then
            echo "❌ Push impossible après 5 tentatives (conflits répétés) — correction perdue, à relancer manuellement"
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "✅ Preview corrigé recommité"

      - name: Post critique as GitHub issue
        # Toujours exécutée (if: always()), même si l'étape précédente a
        # échoué — c'est le seul canal qui prévient réellement l'utilisateur
        # (GitHub notifie par email/mobile dès qu'une issue est créée),
        # jamais seulement un echo dans les logs d'Actions que personne ne
        # relit spontanément.
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
            let body;
            let emoji = '❓';
            if (fs.existsSync('/tmp/critique.md')) {
              body = fs.readFileSync('/tmp/critique.md', 'utf8');
              if (fs.existsSync('/tmp/critique.json')) {
                const verdict = JSON.parse(fs.readFileSync('/tmp/critique.json', 'utf8')).verdict;
                emoji = { publiable: '✅', a_corriger: '⚠️', a_revoir_en_profondeur: '🛑' }[verdict] || '❓';
              }
            } else {
              emoji = '❌';
              body = `La critique automatique a échoué pour l'édition du ${tomorrow} — voir les logs du run ${context.runId} pour le détail. Le preview reste généré normalement, seule cette revue automatique n'a pas pu tourner.`;
            }
            // Rapporte le sort de l'auto-correction (étapes "revise" /
            // "revise_commit" ci-dessus) — jamais silencieux, même en échec,
            // pour que la relecture humaine sache si le preview lié plus bas
            // est la version brute de la critique ou déjà une révision.
            const revised = '${{ steps.revise.outputs.revised }}' === 'true';
            const nFindings = '${{ steps.revise.outputs.n_findings }}';
            const commitSha = '${{ steps.revise_commit.outputs.sha }}';
            if (revised && commitSha) {
              body += `\n\n---\n🔧 **${nFindings} correction(s) appliquée(s) automatiquement** ` +
                `d'après cette critique — voir le commit ` +
                `[${commitSha.slice(0, 7)}](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${commitSha}). ` +
                `Le preview lié ci-dessous est déjà la version corrigée ; la relecture humaine de l'après-midi reste nécessaire.`;
            } else if (revised && !commitSha) {
              body += `\n\n---\n⚠️ Une régénération corrigée a été tentée (${nFindings} correction(s) visée(s)) ` +
                `mais aucun commit corrigé n'a été poussé (contenu identique après régénération, ou échec — ` +
                `voir les logs du run ${context.runId}) — le preview lié ci-dessous reste la version non corrigée.`;
            }
            body += `\n\nPreview à relire : https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/preview.html`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${emoji} Critique édition du ${tomorrow}`,
              body,
            });

      - name: Success notification
        if: success()
        run: |
          TOMORROW=$(date -u -d '+1 day' '+%Y-%m-%d')
          echo "✅ Preview generated for $TOMORROW"
          echo "Preview is ready at: preview.html"
          echo "Cost: ~\$0.033 per edition (Phase 1 + Phase 2)"

      - name: Failure notification
        if: failure()
        run: |
          TOMORROW=$(date -u -d '+1 day' '+%Y-%m-%d')
          echo "❌ Preview generation failed for $TOMORROW"
          echo "Check logs above for details"
          exit 1
