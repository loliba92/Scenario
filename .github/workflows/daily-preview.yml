name: Générer preview édition

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-preview]

permissions:
  contents: write

jobs:
  generate-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q beautifulsoup4

      - name: Generate brief for tomorrow
        run: |
          # Check if API key is available
          if [ -z "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "❌ ERROR: OPENROUTER_API_KEY secret not configured"
            echo "Configure it at: https://github.com/loliba92/Scenario/settings/secrets/actions"
            exit 1
          fi

          cd scripts/edition
          # Get tomorrow's date (YYYY-MM-DD)
          TOMORROW=$(date -u -d '+1 day' '+%Y-%m-%d')
          echo "Generating brief for $TOMORROW..."
          OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" python3 generate_fallback_brief.py --date "$TOMORROW" 2>&1 | tee /tmp/phase1.log
          if [ $? -ne 0 ]; then
            echo "❌ Phase 1 failed"
            exit 1
          fi
          echo "✅ Phase 1 successful"

      - name: Generate preview edition
        run: |
          cd scripts/edition
          TOMORROW=$(date -u -d '+1 day' '+%Y-%m-%d')
          echo "Generating preview edition for $TOMORROW..."
          OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" PEXELS_API_KEY="${{ secrets.PEXELS_API_KEY }}" python3 generate_daily_edition.py --brief ../../editorial-briefs/"$TOMORROW".json 2>&1 | tee /tmp/phase2.log
          if [ $? -ne 0 ]; then
            echo "❌ Phase 2 failed"
            exit 1
          fi
          echo "✅ Phase 2 successful"

      - name: Copy preview to root
        run: |
          TOMORROW=$(date -u -d '+1 day' '+%Y-%m-%d')
          if [ -f "_prototype-out/$TOMORROW.html" ]; then
            cp "_prototype-out/$TOMORROW.html" "preview.html"
            cp "_prototype-out/$TOMORROW.content.json" ".preview-content.json"
            echo "✅ Preview files copied"
          else
            echo "❌ Preview HTML not found"
            exit 1
          fi

      - name: Commit preview
        run: |
          git config user.name "Claude Preview Bot"
          git config user.email "noreply@anthropic.com"
          TOMORROW=$(date -u -d '+1 day' '+%Y-%m-%d')
          git add preview.html .preview-content.json "editorial-briefs/$TOMORROW.json"
          git commit -m "Daily preview: $TOMORROW - $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "Nothing to commit"
          git push origin main

      - name: Success notification
        if: success()
        run: |
          TOMORROW=$(date -u -d '+1 day' '+%Y-%m-%d')
          echo "✅ Preview generated for $TOMORROW"
          echo "Preview is ready at: preview.html"
          echo "Cost: ~\$0.033 per edition (Phase 1 + Phase 2)"

      - name: Failure notification
        if: failure()
        run: |
          TOMORROW=$(date -u -d '+1 day' '+%Y-%m-%d')
          echo "❌ Preview generation failed for $TOMORROW"
          echo "Check logs above for details"
          exit 1
