name: Enrichir les dossiers de sujets

# Complète les dossiers de sujets INCOMPLETS de data/sujets.json (contexte, rationnel,
# mots-clés pour chercher les articles, pistes de sources) avec un modèle qui dispose
# d'une recherche web — voir scripts/edition/enrich_sujets.py pour les garde-fous
# (jamais d'écrasement d'un champ déjà écrit, jamais d'invention, URL gardées seulement
# si elles figurent parmi les citations réelles, sujet dépassé signalé).
#
# À la migration (1er octobre 2026), aucun des 159 sujets n'avait de rationnel ni de
# mots-clés ; on enrichit par lots bornés (10 par défaut), tête de file d'abord, pour que
# le coût reste prévisible. Relancer jusqu'à ce que « sujets.py incomplets » soit vide
# (la page « file de sujets » du dashboard montre l'avancement).
#
# Secret requis (déjà présent) : OPENROUTER_API_KEY

on:
  # Chaque soir : relève les chiffres du graphique « Les chiffres » pour les 3 prochains sujets de la file
  # (ajouté le 4 octobre 2026), pour que le brief du lendemain n'ait pas à les chercher dans l'urgence.
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:
    inputs:
      donnees:
        description: "Relever les chiffres du graphique « Les chiffres » (recherche web) pour les sujets de la file qui n'en ont pas — au lieu de compléter les dossiers incomplets"
        type: boolean
        required: false
        default: false
      max:
        description: "Nombre maximum de sujets traités dans ce lot"
        required: false
        default: "10"
      reformuler:
        description: "Réécrire la problématique (champ rationnel) des dossiers rédigés à l'ancienne, sans recherche web — au lieu de compléter les dossiers incomplets"
        type: boolean
        required: false
        default: false
      apercu:
        description: "Avec « reformuler » : afficher les textes proposés dans le journal, sans rien écrire (pour comparer des modèles)"
        type: boolean
        required: false
        default: false
      forcer:
        description: "Avec « reformuler » : réécrit aussi les problématiques déjà au bon format (pour corriger des repères de temps périmés)"
        type: boolean
        required: false
        default: false
      model:
        description: "Modèle OpenRouter (ex. nvidia/nemotron-3-ultra-550b-a55b:free), plusieurs séparés par des virgules (ils se relaient), ou « gratuits » (6 modèles gratuits) — vide = « gratuits » (défaut du script)"
        required: false
        default: ""
      registre:
        description: "Clé de section à cibler (geopolitique, actualite_francaise, economie, sciences, culture, sport, carte_blanche) — vide = tous"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  enrichir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install beautifulsoup4

      # Même discipline que hot-topics.yml : à chaque essai on repart d'un main fraîchement
      # fetché (jamais de rebase d'un diff déjà calculé) et on relance le script dessus.
      - name: Enrichir, committer et pousser (relance depuis zéro si le push est refusé)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAX: ${{ github.event.inputs.max }}
          REGISTRE: ${{ github.event.inputs.registre }}
          REFORMULER: ${{ github.event.inputs.reformuler }}
          APERCU: ${{ github.event.inputs.apercu }}
          MODEL: ${{ github.event.inputs.model }}
          FORCER: ${{ github.event.inputs.forcer }}
          DONNEES: ${{ github.event.inputs.donnees }}
          EVENT: ${{ github.event_name }}
        run: |
          git config user.name "scenario-topics-bot"
          git config user.email "actions@users.noreply.github.com"
          ARGS="--max ${MAX:-10}"
          if [ "$EVENT" = "schedule" ]; then ARGS="--donnees --max 3"; fi
          if [ "$DONNEES" = "true" ]; then ARGS="$ARGS --donnees"; fi
          if [ -n "$REGISTRE" ]; then ARGS="$ARGS --registre $REGISTRE"; fi
          if [ "$REFORMULER" = "true" ]; then ARGS="$ARGS --reformuler"; fi
          if [ "$APERCU" = "true" ]; then ARGS="$ARGS --apercu"; fi
          if [ "$FORCER" = "true" ]; then ARGS="$ARGS --forcer"; fi
          if [ -n "$MODEL" ]; then
            case "$MODEL" in
              *[!A-Za-z0-9._:/,-]*) echo "Nom de modèle invalide : $MODEL" >&2; exit 1 ;;
            esac
            ARGS="$ARGS --model $MODEL"
          fi
          for attempt in 1 2 3; do
            echo "=== Essai $attempt/3 ==="
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/edition/enrich_sujets.py $ARGS
            git add data/sujets.json sujets-prioritaires.md
            if git diff --cached --quiet; then
              echo "Aucun changement — rien à committer."
              exit 0
            fi
            git commit -m "[sujets] dossiers enrichis, problématiques réécrites ou chiffres de graphique relevés"
            if git push origin main; then
              echo "Poussé avec succès (essai $attempt)."
              exit 0
            fi
            echo "Push refusé (essai $attempt) — main a bougé entre-temps, on relance depuis un état frais."
          done
          echo "Échec après 3 essais — enrichissement non enregistré, relancer le workflow." >&2
          exit 1
