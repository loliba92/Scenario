name: Édition — prototype rédaction OpenRouter (Phase 1)

# Prototype de la chaîne "recherche (Claude Code) / rédaction (OpenRouter)"
# validée dans la conversation qui a précédé ce workflow — voir
# docs/routine-redaction-prompt.md et docs/routine-brief-format.md.
#
# PHASE 1 — PROTOTYPE UNIQUEMENT :
#   - déclenchement manuel (workflow_dispatch) uniquement, pas de cron ;
#   - AUCUN commit, AUCUN push, AUCUNE publication ;
#   - le trigger Claude Code Remote "Scénario" reste désactivé et n'est
#     pas touché par ce workflow ;
#   - rien dans docs/routine-prompt.md ni dans les workflows existants
#     (translate-en.yml, pub.yml, hebdo.yml, reads.yml, audience.yml)
#     n'est modifié par cette chaîne — additif et réversible.
#
# La sortie (l'édition de test générée + les logs) est uniquement publiée
# comme artifact GitHub Actions, à inspecter manuellement pour comparer à
# une édition produite par l'ancien système.
#
# Secret requis (déjà existant, voir translate-en.yml/pub.yml/hebdo.yml) :
#   OPENROUTER_API_KEY

on:
  workflow_dispatch:
    inputs:
      brief:
        description: "Chemin du brief à utiliser"
        required: false
        default: "editorial-briefs/2026-09-20.json"
      dry_run:
        description: "true = utilise la fixture locale, aucun appel OpenRouter (test de la mécanique uniquement)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install beautifulsoup4

      - name: Générer l'édition de test
        working-directory: scripts/edition
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          ARGS="--brief ../../${{ github.event.inputs.brief }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 generate_daily_edition.py $ARGS --out ../../_prototype-out/output.html

      - name: Uploader la sortie de test comme artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edition-prototype-${{ github.run_id }}
          path: _prototype-out/
          retention-days: 14
          if-no-files-found: warn

      # Rappel explicite dans les logs, pour qu'il n'y ait jamais de doute
      # en relisant un run passé : ce job ne publie jamais rien.
      - name: Rappel — aucune publication
        if: always()
        run: echo "Phase 1 prototype : aucun commit, aucun push, aucune publication n'a été effectué par ce workflow."
