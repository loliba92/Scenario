name: Détection sujets à suivre

# Génère (au plus) une mise à jour de page de suivi par passage — remplace
# la routine Claude Code Remote "Scénario — Détection sujets à suivre"
# (docs/routine-detection-prompt.md, trig_01BYYviSQge2CDcYkzBbYcjT).
# Voir scripts/detection/generate_suivi_update.py pour le détail complet
# et les garde-fous (jamais de clôture automatique, jamais plus d'un sujet
# par passage, jamais un sujet dont le point de référence a moins de 10
# jours, pourcentages toujours vérifiés à 100%).
#
# Demandé le 17 septembre 2026 : « on prend claude code via open router,
# j'ai besoin de faire ça pour réduire mes tokens » — le jugement éditorial
# (recherche web, réestimation, sélection) reste le même qu'avant, mais
# facturé sur OPENROUTER_API_KEY plutôt que sur le forfait Claude Code.
#
# Cadence : passée à 1x/semaine (lundi ~2h Paris) le 19 septembre 2026,
# retour utilisateur après un incident de coût réel (MAX_CANDIDATES_PER_RUN
# ajouté le même jour dans generate_suivi_update.py, voir docs/ARCHITECTURE.md
# — sans plafond, le coût par passage était proportionnel au nombre de
# suivis actifs, jusqu'à ~1,78 $ constaté en conditions réelles). Comme
# pour reads.yml/post-edition.yml, le `schedule` GitHub Actions n'est
# qu'un filet — le déclenchement principal passe par cron-job.org
# (workflow_dispatch), voir docs/ARCHITECTURE.md. Les deux cadences
# doivent rester alignées sur l'hebdo : un filet plus fréquent que le
# déclenchement principal redéclencherait le coût qu'on vient de corriger,
# indépendamment de la fréquence choisie côté cron-job.org.
#
# Secret requis (déjà présent, voir pub.yml/translate-en.yml) :
#   OPENROUTER_API_KEY

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 1 * * 1'  # lundi ~2-3h Paris selon heure d'été/hiver

permissions:
  contents: write
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install beautifulsoup4 playwright

      - name: Installer Chromium
        run: python3 -m playwright install --with-deps chromium

      - name: Détection et mise à jour
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 scripts/detection/generate_suivi_update.py

      - name: Committer et pousser
        run: |
          git config user.name "scenario-detection-bot"
          git config user.email "actions@users.noreply.github.com"
          git add suivi/ docs/sujets-a-suivre.md feed-suivi.xml \
                   assets/social/suivi/ assets/social/topic-images/
          if git diff --cached --quiet; then
            echo "Aucun changement — rien à committer."
            exit 0
          fi
          git commit -m "[détection] mise à jour automatique d'un suivi"
          git pull --rebase origin main
          git push origin main

      # Issue récapitulative — même principe que hot-topics.yml, ajouté le
      # 19 septembre 2026 (retour utilisateur, plus facile à suivre qu'en
      # rouvrant les logs). Toujours créée après une exécution réelle
      # (detection-run-summary.md écrit à chaque run non-dry-run par
      # generate_suivi_update.py, qu'un sujet ait été mis à jour ou non) —
      # contrairement à hot-topics.yml, jamais conditionnelle à un contenu
      # trouvé : après l'incident de coût, la valeur ici est justement de
      # voir aussi les passages "RAS"/"rien de significatif".
      - name: Créer une issue récapitulative
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f detection-run-summary.md ]; then
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "🔍 Détection — $(date -u +%Y-%m-%d)" \
              --body-file detection-run-summary.md
          else
            echo "detection-run-summary.md absent (probablement un échec avant ce point) — pas d'issue créée."
          fi
