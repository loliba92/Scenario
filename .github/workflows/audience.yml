name: Update audience data

# Met à jour le-projet.html (#audience) et dashboard.html (KPI, graphiques,
# agenda éditorial, autonomie par registre) à partir de l'API GoatCounter —
# tâche purement mécanique (appel API + arithmétique + remplissage de
# gabarit, aucun jugement éditorial réel requis), volontairement hors de
# Claude Code : voir scripts/seo/update_audience.py pour le détail complet
# et l'historique de la décision (12 septembre 2026, même raisonnement que
# reads.yml le 3 septembre : pas besoin d'une session LLM pour ça).
#
# Remplace la routine Claude Code Remote hebdomadaire "Scénario — Audience"
# (docs/routine-audience-prompt.md) — une fois ce workflow validé fiable en
# conditions réelles, ce trigger doit être supprimé (double mise à jour
# sinon, sur les mêmes fichiers).
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   GOATCOUNTER_TOKEN — déjà utilisé par reads.yml, aucun nouveau secret.
#   OPENROUTER_API_KEY — déjà présent (rédaction/pub/détection) — ajouté le
#   17 septembre 2026 pour les KPI de coût OpenRouter du dashboard (voir
#   fetch_openrouter_cost() dans update_audience.py) — jamais bloquant si
#   absent ou si l'appel échoue, le reste du dashboard continue.

on:
  workflow_dispatch: {}  # bouton "Run workflow" dans l'onglet Actions, pour tester sans attendre l'heure pile

permissions:
  contents: write

jobs:
  update-audience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Récupérer les données GoatCounter/OpenRouter et régénérer le-projet.html/dashboard.html
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 scripts/seo/update_audience.py

      - name: Committer et pousser seulement si des fichiers ont changé
        run: |
          git config user.name "scenario-audience-bot"
          git config user.email "actions@users.noreply.github.com"
          git add le-projet.html dashboard.html assets/data/openrouter-cost.json
          if git diff --cached --quiet; then
            echo "Aucun changement — rien à committer."
            exit 0
          fi
          # Commit d'abord, rebase ensuite : `git pull --rebase` refuse de
          # tourner avec des changements déjà indexés — même règle que
          # reads.yml/translate-en.yml (bug réel du 3 septembre sur ce point).
          git commit -m "[audience] mise à jour automatique des données d'audience"
          # Retry avec rebase en cas de push concurrent — ce workflow tourne
          # plusieurs fois par jour en parallèle de post-edition/translate-en/
          # reads/hot-topics, qui poussent tous sur main : un seul essai sans
          # filet (comme avant ce correctif) échouait ~40% du temps sur un
          # simple conflit de timing (incident du 26 septembre 2026, runs
          # #66/#71 : "cannot lock ref ... is at X but expected Y"), laissant
          # le dashboard figé sur les valeurs du run précédent. Même
          # mécanique que translate-en.yml/post-edition.yml/hot-topics.yml.
          pushed=false
          for i in 1 2 3 4 5; do
            if git push origin main; then
              pushed=true
              break
            fi
            echo "Push rejeté (tentative $i/5), rebase et nouvel essai..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          if [ "$pushed" != true ]; then
            echo "::error::Push impossible après 5 tentatives (conflits répétés) — dashboard non mis à jour, à relancer."
            exit 1
          fi
