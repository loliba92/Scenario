name: Régénérer le preview du 24/09 (complexité relevée)

# Temporaire — à supprimer après usage. Régénère UNIQUEMENT le contenu
# (Phase 2, sujet déjà fixé dans editorial-briefs/2026-09-24.json) après
# correction de sujet.complexite (3 -> 4) pour appliquer le nouveau
# palier pédagogique renforcé (docs/routine-redaction-prompt.md), sans
# repasser par la génération d'un nouveau brief/sujet.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: pip install -q beautifulsoup4

      - name: Régénérer l'édition à partir du brief déjà corrigé
        run: |
          cd scripts/edition
          OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" PEXELS_API_KEY="${{ secrets.PEXELS_API_KEY }}" python3 generate_daily_edition.py --brief ../../editorial-briefs/2026-09-24.json

      - name: Copier vers le preview
        run: |
          cp "_prototype-out/2026-09-24.html" "preview.html"
          cp "_prototype-out/2026-09-24.content.json" ".preview-content.json"
          mkdir -p editorial-previews
          cp "_prototype-out/2026-09-24.content.json" "editorial-previews/2026-09-24.content.json"
          if [ -f "_prototype-out/2026-09-24.photo-credits.json" ]; then
            cp "_prototype-out/2026-09-24.photo-credits.json" "editorial-previews/2026-09-24.photo-credits.json"
          fi

      - name: Committer et pousser
        run: |
          git config user.name "Claude Preview Bot"
          git config user.email "noreply@anthropic.com"
          git add preview.html .preview-content.json editorial-previews/2026-09-24.content.json
          if [ -f "editorial-previews/2026-09-24.photo-credits.json" ]; then
            git add editorial-previews/2026-09-24.photo-credits.json
          fi
          git commit -m "Régénérer le preview du 24/09 — complexité 4, style pédagogique renforcé" || { echo "Rien à committer"; exit 0; }
          pushed=false
          for i in 1 2 3 4 5; do
            if git push origin main; then
              pushed=true
              break
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          if [ "$pushed" != true ]; then
            echo "::error::Push impossible après 5 tentatives"
            exit 1
          fi
