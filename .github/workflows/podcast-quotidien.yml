name: Podcast — épisode du jour

# Chaque jour, après « Rédaction et publication » : écrit le texte parlé de la dernière édition, le fait lire par la
# voix Sulafat (Gemini), sans correction ni normalisation avec l'ouverture musicale, range le MP3 dans une Release GitHub et l'ajoute au flux
# https://lesscenarios.fr/podcast.xml que Spotify relit. Décidé le 3 octobre 2026 (« on l'automatise pour demain »).
# Idempotent : si la Release podcast-AAAA-MM-JJ existe déjà, il n'y a rien à faire (sauf « forcer »).
# Secrets : OPENROUTER_API_KEY (texte et voix) et GEMINI_API_KEY (contrôle du début de l'audio).
#
# VOIX PAR DÉFAUT : Gemini Sulafat, sans correction de voix ni normalisation du volume (retour du 7 octobre 2026 : Voxtral
# avec correction sifflait). Pour essayer Voxtral : modifier les trois lignes « RETOUR » de l'étape « Choisir l'édition »
# (VOIX_DEFAUT=fr_marie_curious, MODELE_DEFAUT=mistralai/voxtral-mini-tts-2603, CLAIR_DEFAUT=true), ou lancer le workflow
# à la main avec ces valeurs. Si la voix choisie échoue, l'épisode est refait avec Gemini Sulafat (repli).
# Variable de dépôt facultative PODCAST_OWNER_EMAIL (sinon contact@lesscenarios.fr, voir build_feed.py).

on:
  workflow_run:
    workflows: ["Rédaction et publication"]
    types: [completed]
  # Reprises : le quota gratuit des voix Google se remet à zéro à minuit heure du Pacifique (07 h ou 08 h UTC), après
  # la publication de l'édition (04 h UTC). Si le premier essai échoue faute de quota, un de ces passages le refait ;
  # sans effet si l'épisode du jour existe déjà.
  schedule:
    - cron: "37 7 * * *"
    - cron: "17 9 * * *"
    - cron: "47 10 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Édition à lire (AAAA-MM-JJ) — vide = dernière édition publiée"
        required: false
        default: ""
      forcer:
        description: "Refaire l'épisode même si la Release existe déjà"
        type: boolean
        required: false
        default: false
      voix:
        description: "Voix du narrateur (ex. Sulafat pour Gemini, fr_marie_curious pour Voxtral)"
        required: false
        default: "Sulafat"
      modele_tts:
        description: "Modèle de voix OpenRouter (google/gemini-3.8-flash-tts ou mistralai/voxtral-mini-tts-2603)"
        required: false
        default: "google/gemini-3.8-flash-tts"
      clair:
        description: "Corriger la voix (présence douce et anti-sifflantes, pour Voxtral ; inutile pour Gemini)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: podcast-quotidien
  cancel-in-progress: false

jobs:
  episode:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install beautifulsoup4 pillow
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }

      - name: Choisir l'édition
        id: ed
        env:
          DATE: ${{ github.event.inputs.date }}
          VOIX: ${{ github.event.inputs.voix }}
          MODELE: ${{ github.event.inputs.modele_tts }}
          CLAIR: ${{ github.event.inputs.clair }}
          FORCER: ${{ github.event.inputs.forcer }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$DATE" in ""|[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "Date invalide : $DATE" >&2; exit 1 ;; esac
          # RETOUR : valeurs utilisées pour les passages automatiques (sans saisie à la main). Pour essayer Voxtral :
          # VOIX_DEFAUT=fr_marie_curious, MODELE_DEFAUT=mistralai/voxtral-mini-tts-2603, CLAIR_DEFAUT=true.
          VOIX_DEFAUT=Sulafat                               # RETOUR
          MODELE_DEFAUT=google/gemini-3.8-flash-tts          # RETOUR
          CLAIR_DEFAUT=false                                # RETOUR
          [ -n "$VOIX" ] || VOIX="$VOIX_DEFAUT"
          [ -n "$MODELE" ] || MODELE="$MODELE_DEFAUT"
          [ -n "$CLAIR" ] || CLAIR="$CLAIR_DEFAUT"
          case "$VOIX" in *[!A-Za-z_]*) echo "Voix invalide : $VOIX" >&2; exit 1 ;; esac
          case "$MODELE" in *[!A-Za-z0-9._/-]*) echo "Modèle invalide : $MODELE" >&2; exit 1 ;; esac
          case "$CLAIR" in true|false) ;; *) echo "Valeur invalide pour clair : $CLAIR" >&2; exit 1 ;; esac
          RATTRAPAGE=""
          if [ -z "$DATE" ]; then
            DATE=$(ls archives | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.html$' | sort | tail -1 | sed 's/\.html$//')
            # L'épisode du jour d'abord ; une fois publié, on passe à la liste de rattrapage (une ligne par passage)
            if gh release view "podcast-$DATE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              LIGNE=$(grep -vE '^[[:space:]]*(#|$)' podcast/rattrapage.txt 2>/dev/null | head -1 || true)
              if [ -n "$LIGNE" ]; then
                DATE=$(echo "$LIGNE" | awk '{print $1}')
                case "$DATE" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "Ligne de rattrapage invalide : $LIGNE" >&2; exit 1 ;; esac
                [ -f "archives/$DATE.html" ] || { echo "Pas d'édition pour $DATE" >&2; exit 1; }
                echo "$LIGNE" | grep -qw forcer && FORCER=true
                RATTRAPAGE=1
                echo "Rattrapage : $LIGNE"
              fi
            fi
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "voix=$VOIX" >> "$GITHUB_OUTPUT"
          echo "modele=$MODELE" >> "$GITHUB_OUTPUT"
          echo "clair=$CLAIR" >> "$GITHUB_OUTPUT"
          echo "rattrapage=$RATTRAPAGE" >> "$GITHUB_OUTPUT"
          if [ "$FORCER" != "true" ] && gh release view "podcast-$DATE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Épisode du $DATE déjà publié : rien à faire."
            echo "deja=true" >> "$GITHUB_OUTPUT"
          else
            echo "deja=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Écrire le texte et le faire lire
        if: steps.ed.outputs.deja != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE="${{ steps.ed.outputs.date }}"
          SOURCE=auto
          # Refaire un épisode (« forcer ») : on garde le texte déjà publié, seule la voix et la musique sont refaites.
          if [ -f "podcast/textes/$DATE.txt" ]; then
            SOURCE="podcast/textes/$DATE.txt"   # texte du dépôt (relu et retouché à la main) : prioritaire
          elif gh release download "podcast-$DATE" --pattern "$DATE.txt" --dir _texte --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
            SOURCE="_texte/$DATE.txt"
          fi
          echo "Source du texte : $SOURCE"
          OPT=""
          [ "${{ steps.ed.outputs.clair }}" = "true" ] && OPT="--clair"
          if ! python3 scripts/podcast/narration.py "$SOURCE" --date "$DATE" --voix "${{ steps.ed.outputs.voix }}" \
              --modele-tts "${{ steps.ed.outputs.modele }}" $OPT --ouverture; then
            # Repli : si la voix choisie échoue (service indisponible, voix refusée), l'épisode du jour est quand même
            # produit, avec Gemini Sulafat. Le texte déjà publié ou du dépôt est repris ; sinon il est réécrit.
            echo "::warning::Voix ${{ steps.ed.outputs.voix }} en échec : repli sur Gemini Sulafat"
            python3 scripts/podcast/narration.py "$SOURCE" --date "$DATE" --voix Sulafat \
              --modele-tts google/gemini-3.8-flash-tts --ouverture
          fi
          ls -la _podcast-out

      - name: Ranger dans une Release et ajouter au flux
        if: steps.ed.outputs.deja != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.ed.outputs.date }}
          PODCAST_OWNER_EMAIL: ${{ vars.PODCAST_OWNER_EMAIL }}
        run: |
          MP3="_podcast-out/$DATE.mp3"
          [ -f "$MP3" ] || { echo "MP3 absent" >&2; exit 1; }
          TAG="podcast-$DATE"
          NOM="$DATE"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Épisode refait : Spotify ne reprend un fichier modifié que si l'adresse du fichier change
            # (remplacer le fichier à la même adresse n'est pas détecté). Nouveau nom : AAAA-MM-JJ-HHMM.mp3.
            NOM="$DATE-$(date -u +%H%M)"
            cp "$MP3" "_podcast-out/$NOM.mp3"
            MP3="_podcast-out/$NOM.mp3"
            gh release upload "$TAG" "$MP3" "_podcast-out/$DATE.txt" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$MP3" "_podcast-out/$DATE.txt" --repo "$GITHUB_REPOSITORY" \
              --title "Épisode du $DATE" \
              --notes "Épisode audio de l'édition du $DATE, lu par une voix de synthèse (intelligence artificielle). Texte tiré de l'article publié sur lesscenarios.fr."
          fi
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$NOM.mp3"
          TAILLE=$(stat -c %s "$MP3")
          DUREE=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$MP3" | cut -d. -f1)
          TITRE=$(python3 -c "import sys;sys.path.insert(0,'scripts/podcast');import generate_podcast as g;from pathlib import Path;print(g.lire_edition(Path('archives/$DATE.html'))['titre'])")
          python3 scripts/podcast/build_feed.py --ajouter "$DATE" --url "$URL" --taille "$TAILLE" --duree "$DUREE" --titre "$TITRE" \
            --description "$TITRE Épisode lu par une voix de synthèse (intelligence artificielle), à partir de l'édition du $DATE. Version écrite : https://lesscenarios.fr/archives/$DATE.html Rien n'est écrit à l'avance."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcast.xml data/podcast-episodes.json
          if [ -d podcast/episodes ]; then git add podcast/episodes; fi
          git commit -m "Podcast : épisode du $DATE ajouté au flux"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "Poussée impossible après 5 essais" >&2
          exit 1

      - name: Retirer l'épisode de la liste de rattrapage
        if: steps.ed.outputs.rattrapage == '1'
        env:
          DATE: ${{ steps.ed.outputs.date }}
        run: |
          grep -qE "^$DATE( |$)" podcast/rattrapage.txt || exit 0
          sed -i -E "/^$DATE( |$)/d" podcast/rattrapage.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcast/rattrapage.txt
          git commit -m "Podcast : épisode du $DATE retiré de la liste de rattrapage"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
