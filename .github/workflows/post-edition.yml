name: Édition — rédaction + post-édition (OpenRouter)

# Chaîne complète : rédaction (OpenRouter) puis post-édition (photo,
# image Instagram, feed.xml, sitemap.xml/sitemap-news.xml, glossaire.html,
# archives.html, pages thématiques) — voir docs/BACKLOG.md
# § « Chaîne rédaction OpenRouter » pour l'historique complet.
#
# Deux modes, contrôlés par `publish` (toujours true si déclenché par le
# cron, contrôlable manuellement sinon) :
#   - publish=false (défaut en déclenchement manuel) : AUCUN commit,
#     AUCUN push — tout s'écrit sous _prototype-out/, jamais dans les
#     vrais fichiers du dépôt (voir scripts/edition/generate_post_edition.py,
#     discipline du bac à sable). Pour tester sans risque.
#   - publish=true : écrit les vrais fichiers (index.html, archives/,
#     feed.xml, sitemap*.xml, glossaire.html, archives.html, themes/*.html,
#     images sociales), puis les commite et les pousse sur main.
#
# Automatisation complète (activée le 14 septembre 2026, décision
# explicite de l'utilisateur) : la recherche du sujet du jour (sélection,
# anti-doublon, vérification factuelle) reste sur Claude Code — hors de
# portée d'un cron GitHub Actions, qui ne peut pas faire cette recherche
# lui-même. Le trigger Claude Code Remote « Scénario » (cron 0 4 * * *
# UTC = 6h Paris en CEST) écrit et committe editorial-briefs/{date}.json,
# puis s'arrête — voir docs/routine-prompt.md § « STATUT ACTUEL ». Ce
# workflow-ci prend le relais un peu plus tard (30 4 * * * UTC = 6h30
# Paris en CEST, marge d'environ 30 min — réduite depuis 1h le
# 15 septembre 2026, retour utilisateur, ⚠️ marge plus courte face au
# trigger CCR ci-dessus si celui-ci est un jour réactivé, voir
# docs/routine-prompt.md § « STATUT ACTUEL » : il est désactivé au moment
# de ce changement) : il lit ce brief et fait tout le reste, jusqu'à la
# publication réelle. Dérive saisonnière connue et acceptée (cron UTC
# fixe, pas d'ajustement DST automatique) — les deux crons restent dans
# le bon ordre relatif toute l'année, seule l'heure Paris affichée dérive
# d'1h en hiver (CET, 5h30).
#
# Repli automatique de la recherche via OpenRouter (ajouté le
# 15 septembre 2026, retour utilisateur — « j'ai trop de pb de token,
# Claude Code se bloque et tout le process se bloque ») : si le brief du
# jour n'existe toujours pas (CCR bloqué/pas déclenché), au lieu d'échouer
# sèchement (« Brief introuvable »), le job appelle
# scripts/edition/generate_fallback_brief.py — recherche complète (sujet,
# anti-doublon, faits, sources, scénarios) via un seul appel OpenRouter
# avec le server tool `openrouter:web_search` (le modèle décide lui-même
# combien de recherches faire, exécutées côté OpenRouter). JAMAIS le
# chemin principal : ne se déclenche que si le brief est vraiment absent,
# quel que soit le mode de déclenchement (cron ou manuel) — si CCR a déjà
# produit un vrai brief, il prime toujours, ce script ne tourne pas. Le
# brief produit est committé immédiatement (séparément de `publish`, qui
# ne gouverne que la publication du site) — une recherche réelle, une fois
# payée, ne doit jamais être perdue même en cas d'échec plus loin dans le
# pipeline.
#
# Secrets requis (Settings → Secrets and variables → Actions → Secrets) :
#   OPENROUTER_API_KEY (rédaction, et repli recherche si besoin)
#   PEXELS_API_KEY (photo de sujet — optionnel : absent, le job continue
#     avec le repli registre/générique, jamais bloquant)
#
# Modèle de rédaction (ajouté le 14 septembre 2026, retour utilisateur —
# « un moyen de jouer sur le modèle ») : par défaut, generate_daily_edition.py
# utilise DEFAULT_MODEL (anthropic/claude-sonnet-5). Pour le changer sans
# toucher au code :
#   - de façon durable, pour TOUS les runs (cron inclus) : Settings →
#     Secrets and variables → Actions → Variables → créer/éditer
#     OPENROUTER_MODEL (ex. "openai/gpt-5", voir openrouter.ai/models pour
#     l'identifiant exact) ;
#   - ponctuellement, pour UN SEUL run manuel : onglet Actions → "Run
#     workflow" → champ "model", prioritaire sur la variable de dépôt pour
#     ce run précis uniquement, sans rien changer par ailleurs.

on:
  schedule:
    - cron: '30 4 * * *'
    # Filet de secours (ajouté le 17 septembre 2026, incident réel :
    # le run du 16 septembre programmé à 4h30 UTC ne s'est déclenché
    # qu'à 9h25 UTC, ~5h de retard — comportement documenté de GitHub
    # Actions lui-même : les triggers `schedule` sont sujets à des
    # retards/sauts de charge, jamais garantis à l'heure pile, parfois
    # sautés purement et simplement). Un 2e cron 1h plus tard couvre le
    # cas où le premier a été sauté ou trop retardé — jamais un doublon
    # grâce au step "Vérifier si l'édition du jour est déjà publiée"
    # plus bas, qui arrête net ce run si le premier a déjà publié.
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      brief:
        description: "Chemin du brief à utiliser — laisser VIDE pour calculer automatiquement le brief du jour (Europe/Paris), comme le cron. Ne préciser que pour rejouer un brief précis (test, rattrapage)."
        required: false
        default: ""
      dry_run:
        description: "true = rédaction sur fixture locale, aucun appel OpenRouter (test de la mécanique uniquement) — toujours false si déclenché par le cron"
        required: false
        default: "false"
      skip_photo:
        description: "true = n'appelle pas Pexels (test de la mécanique post-édition sans réseau/clé) — toujours false si déclenché par le cron"
        required: false
        default: "false"
      publish:
        description: "true = écrit les vrais fichiers du dépôt et les commite/pousse sur main — toujours true si déclenché par le cron. Défaut false ici pour un test manuel sans risque."
        required: false
        default: "false"
      model:
        description: "Modèle OpenRouter à utiliser pour CE run uniquement (ex. anthropic/claude-sonnet-5, openai/gpt-5, google/gemini-2.5-pro — voir openrouter.ai/models). Vide = utilise la variable de dépôt OPENROUTER_MODEL si définie, sinon le défaut du script."
        required: false
        default: ""

permissions:
  contents: write
  actions: write  # nécessaire pour déclencher translate-en.yml via l'API (voir plus bas)

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # cache: 'pip' (retour utilisateur du 14 septembre 2026, « c'est fou
      # de réinstaller Chromium etc à chaque fois ») : chaque run repart
      # d'une VM neuve, rien n'est jamais gardé d'un run à l'autre par
      # défaut — actions/setup-python met en cache les paquets pip
      # téléchargés (pas leur installation dans le venv, juste le
      # téléchargement) entre les runs, à partir du hash de requirements.txt.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/edition/requirements.txt

      - name: Installer les dépendances
        run: pip install -r scripts/edition/requirements.txt

      # Le binaire Chromium lui-même (le plus gros téléchargement, ~150-300
      # Mo) est mis en cache séparément — clé basée sur requirements.txt,
      # invalidée seulement quand la version de playwright change.
      # `--with-deps` installe AUSSI les dépendances système (apt) : ça,
      # en revanche, ne peut jamais être mis en cache (la VM est neuve à
      # chaque run, les paquets apt n'y survivent pas) — donc toujours
      # réinstallé, mais c'est la partie rapide (quelques secondes),
      # jamais le gros téléchargement du navigateur.
      - name: Cache du navigateur Playwright (Chromium)
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('scripts/edition/requirements.txt') }}

      - name: Installer Chromium (image Instagram)
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Navigateur déjà en cache — seulement les dépendances système (apt) à réinstaller."
            python3 -m playwright install-deps chromium
          else
            echo "Pas de cache — téléchargement complet du navigateur + dépendances système."
            python3 -m playwright install --with-deps chromium
          fi

      # Le déclenchement par schedule (cron) n'a pas d'inputs — le brief
      # du jour est calculé à partir de la date Europe/Paris (même
      # convention que docs/routine-prompt.md, étape 1 : « Déterminer la
      # date... à Paris »). Ce step ne fait plus échouer le job si le
      # brief est absent (voir le step de repli juste après) — seulement
      # calculer son chemin et les options.
      - name: Calculer le brief et les options d'exécution
        id: config
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            BRIEF="editorial-briefs/$(TZ=Europe/Paris date +%F).json"
            DRY_RUN=false
            SKIP_PHOTO=false
            PUBLISH=true
            MODEL="${{ vars.OPENROUTER_MODEL }}"
          else
            # Incident réel du 15 septembre 2026 : le trigger CCR de
            # recherche appelle `gh workflow run post-edition.yml --ref
            # main` (docs/routine-prompt.md, Étape 3bis) sans jamais
            # préciser `brief` — c'est voulu, ce n'est pas son rôle de le
            # calculer. Tant que l'input avait une valeur par défaut fixe
            # (un vieux brief fictif de test), un déclenchement manuel
            # SANS argument retombait silencieusement dessus au lieu du
            # brief du jour. Même repli qu'en `schedule` désormais si
            # l'input est vide : jamais de valeur par défaut figée.
            BRIEF="${{ github.event.inputs.brief }}"
            if [ -z "$BRIEF" ]; then
              BRIEF="editorial-briefs/$(TZ=Europe/Paris date +%F).json"
            fi
            DRY_RUN="${{ github.event.inputs.dry_run }}"
            SKIP_PHOTO="${{ github.event.inputs.skip_photo }}"
            PUBLISH="${{ github.event.inputs.publish }}"
            # Input manuel prioritaire sur la variable de dépôt, pour tester
            # un modèle ponctuellement sans changer le réglage par défaut.
            MODEL="${{ github.event.inputs.model }}"
            if [ -z "$MODEL" ]; then
              MODEL="${{ vars.OPENROUTER_MODEL }}"
            fi
          fi
          {
            echo "brief=$BRIEF"
            echo "dry_run=$DRY_RUN"
            echo "skip_photo=$SKIP_PHOTO"
            echo "publish=$PUBLISH"
            echo "model=$MODEL"
          } >> "$GITHUB_OUTPUT"
          echo "Brief calculé : $BRIEF · dry_run=$DRY_RUN · skip_photo=$SKIP_PHOTO · publish=$PUBLISH · modèle=${MODEL:-<défaut du script>}"

      # Ajouté le 17 septembre 2026 avec le cron de secours 5h30 UTC
      # ci-dessus : sans ce garde-fou, un 2e déclenchement le même jour
      # (secours après un 1er run déjà réussi, ou un rattrapage manuel
      # mal chronométré) repayerait une rédaction complète pour rien —
      # generate_post_edition.py sait déjà s'arrêter proprement
      # (already_published_today()), mais seulement APRÈS la rédaction,
      # donc trop tard pour éviter son coût. Vérifié ici en amont, sur le
      # même critère (article:published_time dans le vrai index.html) —
      # jamais bloquant en publish=false (un test manuel doit pouvoir
      # tourner même si l'édition du jour est déjà publiée).
      - name: Vérifier si l'édition du jour est déjà publiée
        id: already
        run: |
          if [ "${{ steps.config.outputs.publish }}" = "true" ]; then
            DATE_STR=$(basename "${{ steps.config.outputs.brief }}" .json)
            if grep -q "article:published_time\" content=\"$DATE_STR" index.html 2>/dev/null; then
              echo "already=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Édition du $DATE_STR déjà publiée (index.html) — ce run s'arrête ici sans rien refaire (cron de secours ou rattrapage redondant)."
            else
              echo "already=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Repli recherche (voir commentaire en tête de fichier) — ne fait
      # rien si le brief existe déjà (recherche CCR déjà faite, cas
      # normal). Commit + push immédiat, séparé du commit de publication
      # plus bas : une recherche réelle, une fois payée, ne doit jamais se
      # perdre même si un step suivant échoue.
      - name: Repli recherche (OpenRouter) si le brief est absent
        if: steps.already.outputs.already != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          BRIEF="${{ steps.config.outputs.brief }}"
          if [ -f "$BRIEF" ]; then
            echo "Brief déjà présent ($BRIEF) — recherche CCR déjà faite, repli non nécessaire."
            exit 0
          fi
          DATE=$(basename "$BRIEF" .json)
          echo "::warning::Brief introuvable ($BRIEF) — déclenchement du repli recherche via OpenRouter (scripts/edition/generate_fallback_brief.py)."
          ARGS="--date $DATE"
          if [ -n "${{ steps.config.outputs.model }}" ]; then
            ARGS="$ARGS --model ${{ steps.config.outputs.model }}"
          fi
          python3 scripts/edition/generate_fallback_brief.py $ARGS
          git config user.name "scenario-fallback-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$BRIEF"
          git commit -m "brief: repli automatique via OpenRouter (recherche CCR indisponible, $DATE)"
          git pull --rebase origin main
          git push origin main

      - name: Vérifier que le brief existe (après repli éventuel)
        if: steps.already.outputs.already != 'true'
        run: |
          BRIEF="${{ steps.config.outputs.brief }}"
          if [ ! -f "$BRIEF" ]; then
            echo "::error::Brief toujours introuvable après tentative de repli : $BRIEF — ni la recherche CCR ni le repli OpenRouter n'ont produit ce fichier."
            exit 1
          fi

      - name: Rédaction — générer l'édition
        if: steps.already.outputs.already != 'true'
        working-directory: scripts/edition
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          ARGS="--brief ../../${{ steps.config.outputs.brief }}"
          if [ "${{ steps.config.outputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ steps.config.outputs.model }}" ]; then
            ARGS="$ARGS --model ${{ steps.config.outputs.model }}"
          fi
          python3 generate_daily_edition.py $ARGS --out ../../_prototype-out/output.html

      - name: Post-édition — photo, image Instagram, feed.xml, sitemap, archives.html
        if: steps.already.outputs.already != 'true'
        working-directory: scripts/edition
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          ARGS="--brief ../../${{ steps.config.outputs.brief }} --content ../../_prototype-out/output.content.json"
          if [ "${{ steps.config.outputs.skip_photo }}" = "true" ]; then
            ARGS="$ARGS --skip-photo"
          fi
          if [ "${{ steps.config.outputs.publish }}" = "true" ]; then
            ARGS="$ARGS --publish"
          fi
          python3 generate_post_edition.py $ARGS --sandbox-root ../../_prototype-out/post-edition

      # Banque le chiffre "pub" du jour (scripts/pub/bank_chiffre.py) —
      # ajouté le 17 septembre 2026, retour utilisateur : « ce ne serait
      # pas possible d'inclure cette production dans le workflow de
      # l'édition ? ». `pub.yml` lit ce champ au lieu de refaire
      # l'extraction plus tard (voir generate_daily_pub.py,
      # get_chiffre_for_date()). `continue-on-error: true` : un échec ici
      # ne doit jamais faire échouer la publication de l'édition elle-même.
      - name: Banquer le chiffre "pub" du jour
        if: steps.already.outputs.already != 'true' && steps.config.outputs.publish == 'true'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          DATE_STR=$(basename "${{ steps.config.outputs.brief }}" .json)
          python3 scripts/pub/bank_chiffre.py --date "$DATE_STR"

      # Même convention que translate-en.yml/reads.yml : commit d'abord,
      # rebase ensuite (git pull --rebase refuse de tourner avec des
      # changements déjà indexés). Rien à committer si generate_post_edition.py
      # s'est arrêté tôt (édition déjà publiée aujourd'hui, voir son
      # garde-fou already_published_today()) — traité comme un no-op,
      # jamais une erreur.
      - name: Committer et pousser l'édition publiée (uniquement si publish=true)
        if: steps.config.outputs.publish == 'true'
        run: |
          git config user.name "scenario-edition-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html archives/ feed.xml sitemap.xml sitemap-news.xml glossaire.html archives.html themes/ assets/social/topic-images/ assets/social/instagram/ sources-log.json sources.html editorial-briefs/
          if git diff --cached --quiet; then
            echo "Aucun changement — rien à committer (édition déjà publiée aujourd'hui, ou generate_post_edition.py s'est arrêté avant --publish)."
            exit 0
          fi
          git commit -m "Édition du $(TZ=Europe/Paris date +%d/%m/%Y) — chaîne rédaction OpenRouter + post-édition automatique"
          git pull --rebase origin main
          git push origin main

      # Incident réel du 14 septembre 2026 : translate-en.yml (badge EN +
      # lien anglais sur index.html/archives.html) écoute "on: push" sur
      # index.html, mais un push fait avec le GITHUB_TOKEN par défaut ne
      # déclenche JAMAIS d'autre workflow en push — limitation anti-boucle
      # documentée de GitHub Actions, pas un oubli de configuration ici.
      # Résultat observé : l'édition Taïwan publiée plus tôt aujourd'hui
      # n'a jamais eu sa traduction EN. Corrigé en déclenchant translate-en.yml
      # explicitement via l'API workflow_dispatch (fonctionne avec
      # GITHUB_TOKEN, seul le déclenchement PAR push est bloqué) —
      # toujours tenté quand publish=true, même si ce run précis n'avait
      # rien de nouveau à committer : translate-en.yml a son propre
      # garde-fou idempotent (ne fait rien si en/archives/{date}.html
      # existe déjà), donc un déclenchement redondant ne coûte rien.
      - name: Déclencher la traduction EN (translate-en.yml)
        if: steps.config.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/translate-en.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Uploader la sortie de test comme artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-edition-prototype-${{ github.run_id }}
          path: _prototype-out/
          retention-days: 14
          if-no-files-found: warn

      - name: Rappel
        if: always()
        run: |
          if [ "${{ steps.config.outputs.publish }}" = "true" ]; then
            echo "publish=true — voir l'étape 'Committer et pousser' ci-dessus pour le résultat exact (édition publiée, ou rien à committer si déjà publiée aujourd'hui)."
          else
            echo "publish=false : aucun commit, aucun push, aucune publication n'a été effectué par ce workflow."
          fi
