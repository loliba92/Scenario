<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Scénario">
  <!-- Tronc doré (le présent) qui se sépare -->
